<style>
/* Design plan.
   Subject: a personal control panel for life in Warsaw (groceries, deals, prices, tickets, news), used on a
   phone inside Telegram and in a browser at a desk. Scanned, not read: summary before detail, state shown
   in form (pills, stripes, check glyphs), numbers in Manrope with tabular figures, aligned right.
   Color: dark first, the brand (lime #c1f354 on the deep blue-black #0f171f); one accent, used for the
   active tab, primary buttons and marks; semantic good/warn/bad kept apart from it. Light theme: a cool
   off-white, graphite text, lime darkened to #8cc21a (an edge on white) as a fill under dark ink; marks and links switch to a deep olive,
   so lime text never stands on white. Inside Telegram the page sets data-theme from tg.colorScheme and
   tints --bg toward tg.themeParams.bg_color; in a browser prefers-color-scheme decides.
   Type: Manrope 600/700 for headings and numbers, IBM Plex Sans 400/500/600 for text (Cyrillic subsets,
   display=swap, system fallbacks); scale 12/13/15/17/22/28.
   Layout: phone, a slim sticky header (view, date, «выйти» in a browser), content, a fixed bottom bar
   with four tabs and «Ещё», which opens a sheet with the other four. From 900 px a left rail with all
   eight tabs and a content column up to 1040 px, cards in two columns where a view has several.
   Components: 14 px cards on a 1 px line, 44 px+ rows with a pressed state and a focus ring, pills,
   skeletons, designed empty and error states, Lucide icons from the sprite below, charts on tokens. */
:root{color-scheme:dark;
  --bg0:#0f171f;--bg:var(--bg0);--surface:#15202b;--surface-2:#1d2a37;--line:#243343;--press:rgba(230,237,243,.06);
  --fg:#e6edf3;--muted:#8d9aa7;--accent:#c1f354;--accent-ink:#0f171f;--mark:#c1f354;--link:#c1f354;
  --accent-soft:rgba(193,243,84,.13);--good:#5fd38d;--good-bg:rgba(95,211,141,.14);--warn:#f2b84b;
  --warn-bg:rgba(242,184,75,.14);--bad:#ff7070;--bad-bg:rgba(255,112,112,.14);--blue:#7cc4ff;
  --toast:#2a3a4c;--toast-fg:#e6edf3;--scrim:rgba(4,8,12,.6);--shadow:0 10px 40px rgba(0,0,0,.45);
  --r:14px;--bar:64px;--rail:232px;
  --font:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-num:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light;
  --bg0:#eef2f6;--surface:#fff;--surface-2:#e9eef3;--line:#d8e0e8;--press:rgba(15,23,31,.05);--fg:#16202a;
  --muted:#596775;--accent:#8cc21a;--accent-ink:#0f171f;--mark:#4a7a00;--link:#3d6600;--accent-soft:rgba(98,150,0,.12);
  --good:#1d8549;--good-bg:rgba(29,133,73,.11);--warn:#9a5a00;--warn-bg:rgba(200,128,0,.13);--bad:#c22f2f;
  --bad-bg:rgba(194,47,47,.1);--blue:#1f6fb5;--toast:#16202a;--toast-fg:#f3f6f9;--scrim:rgba(15,23,31,.35);
  --shadow:0 10px 40px rgba(15,23,31,.16)}}
:root[data-theme="light"]{color-scheme:light;
  --bg0:#eef2f6;--surface:#fff;--surface-2:#e9eef3;--line:#d8e0e8;--press:rgba(15,23,31,.05);--fg:#16202a;
  --muted:#596775;--accent:#8cc21a;--accent-ink:#0f171f;--mark:#4a7a00;--link:#3d6600;--accent-soft:rgba(98,150,0,.12);
  --good:#1d8549;--good-bg:rgba(29,133,73,.11);--warn:#9a5a00;--warn-bg:rgba(200,128,0,.13);--bad:#c22f2f;
  --bad-bg:rgba(194,47,47,.1);--blue:#1f6fb5;--toast:#16202a;--toast-fg:#f3f6f9;--scrim:rgba(15,23,31,.35);
  --shadow:0 10px 40px rgba(15,23,31,.16)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:15px/1.4 var(--font);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* shell */
.col{max-width:1104px;margin:0 auto}
.hdr{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;min-height:52px;padding:env(safe-area-inset-top) 16px 0;background:var(--bg)}
.hdr h1{flex:1;min-width:0;margin:0;font:700 17px/1.2 var(--font-num);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .date{color:var(--muted);font-size:13px;white-space:nowrap}
.out{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:none;color:var(--muted);font-size:13px}
.out .i{width:16px;height:16px}
.main{padding:4px 16px calc(var(--bar) + 28px + env(safe-area-inset-bottom))}
.main.in{animation:fade .12s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(3px)}}
.rail{display:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;height:calc(var(--bar) + env(safe-area-inset-bottom));padding:0 4px env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--line)}
.tabbar button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;color:var(--muted);font:500 12px/1.1 var(--font)}
.tabbar .ic{display:grid;place-items:center;width:52px;height:30px;border-radius:15px;transition:background .12s}
.tabbar .lb{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabbar [aria-current]{color:var(--fg);font-weight:600}
.tabbar [aria-current] .ic{background:var(--accent);color:var(--accent-ink)}
.scrim{position:fixed;inset:0;z-index:6;background:var(--scrim);opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:7;padding:6px 12px calc(14px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:var(--shadow);transform:translateY(105%);visibility:hidden;transition:transform .24s cubic-bezier(.2,.8,.2,1),visibility 0s .24s}
.more .scrim{opacity:1;visibility:visible;transition:opacity .2s}
.more .sheet{transform:none;visibility:visible;transition:transform .24s cubic-bezier(.2,.8,.2,1)}
.grab{width:36px;height:4px;margin:4px auto 10px;border-radius:2px;background:var(--line)}
.sheet button,.rail button{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;padding:0 12px;border:0;border-radius:12px;background:none;color:var(--fg);font:500 15px/1.2 var(--font);text-align:left}
.sheet .ic,.rail .ic{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--surface-2);color:var(--muted)}
.sheet [aria-current],.rail [aria-current]{background:var(--accent-soft);font-weight:600}
.sheet [aria-current] .ic,.rail [aria-current] .ic{background:var(--accent);color:var(--accent-ink)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font:700 17px/1 var(--font-num)}
.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:var(--accent);color:var(--accent-ink)}
@media (hover:hover){.rail button:hover,.sheet button:hover,.row.tap:hover{background:var(--press)}.tabbar button:hover .ic{background:var(--press)}}
/* blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin:0 0 12px;overflow:hidden}
.ch{display:flex;align-items:center;gap:10px;padding:12px 14px 8px}
.ch:last-child{padding-bottom:12px}
.ch .ico{display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:9px;background:var(--surface-2);color:var(--mark)}
.ch .ico .i{width:16px;height:16px}
.ch h3{flex:1;min-width:0;margin:0;font:700 15px/1.25 var(--font-num)}
.card .sub{padding:0 14px 10px;color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.tap{cursor:pointer;transition:background .12s}
.row.tap:focus-visible{outline-offset:-2px}
.row.tap:active{background:var(--press)}
.row .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.row .t{font-weight:500}
.row b{font-weight:600}
.row .pr{flex:none;text-align:right;font:600 15px/1.3 var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .old{display:block;color:var(--muted);text-decoration:line-through;font:500 13px var(--font-num);font-variant-numeric:tabular-nums}
.row .mk{width:22px;height:22px;color:var(--muted)}
.row .mk.on{color:var(--mark)}
.row.done .t{color:var(--muted);text-decoration:line-through}
.row.soon{background:var(--bad-bg)}
.row.small{min-height:40px}
.lead{display:grid;place-items:center;flex:none;width:22px;color:var(--muted)}
.lead .i{width:18px;height:18px}
.mu{color:var(--muted);font-size:13px}
.clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);font:500 12px/1 var(--font);white-space:nowrap;vertical-align:1px}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--link)}
.t .pill,.mu .pill{margin-left:6px}
.cmp span{white-space:nowrap}
.cmp .cw{font-weight:600;color:var(--link)}
.meter{height:6px;margin:6px 0 2px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:var(--mark)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:0 16px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:600 15px/1.1 var(--font);white-space:nowrap}
.btn .i{width:18px;height:18px}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.warn{background:var(--warn-bg);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.btn.wide{width:100%}
.btn.x{flex:none;padding:0 10px}
.foot{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.foot .btn{flex:1 1 auto;min-width:0;padding:0 12px}
@media (max-width:399px){.foot .btn .i{display:none}}
.bar{display:flex;gap:8px;margin:0 0 12px}
.field{flex:1;min-width:0;display:flex;align-items:center;gap:8px;min-height:46px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);transition:border-color .12s,box-shadow .12s}
.field:focus-within{border-color:var(--mark);box-shadow:0 0 0 3px var(--accent-soft)}
.field .i{width:18px;height:18px;color:var(--muted)}
.field input{flex:1;min-width:0;height:44px;padding:0;border:0;background:none;outline:none;-webkit-appearance:none;appearance:none}
.field input::placeholder{color:var(--muted)}
.seg{display:flex;gap:4px;margin:0 0 12px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.seg button{flex:1;min-width:0;min-height:36px;padding:0 6px;border:0;border-radius:9px;background:none;color:var(--muted);font:600 13px/1 var(--font);white-space:nowrap}
.seg.fit button{flex:auto}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.summary{display:flex;gap:18px;margin:2px 2px 12px;color:var(--muted);font-size:13px}
.summary b{color:var(--fg);font:700 17px var(--font-num);font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-top:1px solid var(--line)}
.tile{padding:12px 14px;background:var(--surface)}
.tile .k{color:var(--muted);font-size:12px}
.tile .v{font:700 17px/1.3 var(--font-num);font-variant-numeric:tabular-nums}
.tile.hero{grid-column:1/-1}
.tile:nth-child(even):last-child{grid-column:1/-1}
.tile.hero .v{font-size:28px;line-height:1.2}
.state{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 16px;color:var(--muted);text-align:center}
.state .i{width:28px;height:28px}
.state p{max-width:32ch;margin:0}
.skel{padding:16px 14px 8px}
.skel i{display:block;height:12px;margin:0 0 12px;border-radius:6px;background:var(--surface-2);animation:pulse 1.2s ease-in-out infinite}
.skel i:nth-child(1){width:42%;height:14px}.skel i:nth-child(2){width:88%}.skel i:nth-child(3){width:64%}
@keyframes pulse{50%{opacity:.45}}
.ptile{position:relative;flex:none;display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font:20px/1 "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;object-fit:cover}
.ptile.big{width:56px;height:56px;font-size:30px}
.ptile .bd{position:absolute;right:-6px;bottom:-6px;padding:2px;border-radius:6px;background:var(--toast);box-shadow:0 0 0 1px var(--line);font-size:12px}
.ptile.none{color:var(--muted)}
.ptile .i{width:18px;height:18px}
.tb{flex:none;display:grid;place-items:center;width:44px;height:44px;margin:-4px;padding:0;border:0;border-radius:10px;background:none;cursor:pointer}
.tb:has(.big){width:64px;height:64px}
.poster{flex:none;width:56px;height:84px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);object-fit:cover}
.poster.ph{display:grid;place-items:center;color:var(--muted)}
.poster.ph .i{width:22px;height:22px}
.row.film{align-items:flex-start}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
button.pill{border:0;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.chips .pill,.chips select{height:44px;padding:0 12px;font-size:13px}
.chips select{font-size:16px}
.chips select{border:1px solid var(--line);border-radius:999px;background:var(--surface-2);color:var(--fg);font-family:var(--font)}
.row.off{opacity:.55}
.stars{display:flex}
.acts+.stars{margin-top:8px}
.row.film:has(>.btn.x) .stars{margin-right:-56px}
.st{position:relative;display:grid;place-items:center;width:44px;height:44px;font-size:22px;line-height:1;color:var(--muted)}
.st.on{color:var(--mark)}
.st.half{background:linear-gradient(90deg,var(--mark) 50%,var(--muted) 50%);-webkit-background-clip:text;background-clip:text;color:transparent}
.st button{position:absolute;top:0;bottom:0;left:0;width:50%;padding:0;border:0;background:none}
.st button+button{left:50%}
.pg{flex:none;display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 8px;border:1px solid var(--line);border-radius:9px;background:none;color:var(--muted);font-size:12px}
.pg .i{width:14px;height:14px}
.row.film .pg{min-height:44px}
.row.dela{flex-wrap:wrap;align-items:flex-start}.row.dela .pg{min-height:44px}.row.dela .pr{margin-top:8px}
.row.dela>.acts{flex-basis:100%;margin:-4px 0 0 48px}
.pg.warn{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.lnk{color:var(--link);font-weight:600;text-decoration:none}
.card ul{margin:0;padding:2px 14px 14px 32px}
.card li{margin:5px 0}
.card li::marker{color:var(--mark)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:0 14px 10px;color:var(--muted);font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%}
.dash{width:14px;border-top:2px dashed var(--mark)}
.chart{display:block;width:100%;height:auto;padding:4px 8px 0}
.chart .ax{stroke:var(--line)}
.chart .grid{stroke:var(--line);stroke-dasharray:2 4}
.chart .tk{fill:var(--muted);font:12px var(--font);font-variant-numeric:tabular-nums}
.chart .tk.strong{fill:var(--fg);font-weight:600;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.chart .ln{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-linejoin:round}
.chart .minl{stroke:var(--mark);stroke-dasharray:4 3;opacity:.8}
.chart .last{stroke:var(--surface);stroke-width:2}
.chart .b{fill:var(--mark)}
.chart .b.now{fill-opacity:.3;stroke:var(--mark)}
.s-lf{fill:var(--mark);background:var(--mark)}.s-al{fill:var(--blue);background:var(--blue)}.s-rc{fill:var(--fg);background:var(--fg)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(var(--bar) + 12px + env(safe-area-inset-bottom));z-index:9;max-width:420px;margin:0 auto;padding:12px 16px;border-radius:12px;background:var(--toast);color:var(--toast-fg);box-shadow:var(--shadow);text-align:center;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none}
#toast.on{opacity:1;transform:none}
#toast.act{pointer-events:auto}
#toast .tl{min-height:44px;margin:-12px 0;padding:0 6px;border:0;background:none;color:var(--accent);font-weight:600}
.row .qty{margin-left:6px;font-weight:400}
.login{max-width:400px;margin:14vh auto 0;padding:28px 20px 12px;text-align:center}
.login .mark{width:52px;height:52px;margin:0 auto 14px;border-radius:15px}
.login h1{margin:0 0 6px;font:700 22px/1.2 var(--font-num)}
.login p{margin:0 0 4px;color:var(--muted)}
.login .widget{min-height:56px;padding:14px 0 8px}
.wrap{margin:0 16px}
@media (min-width:900px){
  .shell{padding-left:var(--rail)}
  .rail{display:flex;flex-direction:column;gap:2px;position:fixed;top:0;bottom:0;left:0;width:var(--rail);padding:20px 12px;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto}
  .rail button{min-height:46px}
  .tabbar,.sheet,.scrim{display:none}
  .hdr{min-height:72px;padding:0 32px}
  .hdr h1{font-size:22px}
  .main{padding:4px 32px 48px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;margin-bottom:12px}
  .cols>.card{margin:0}
  .cols>.state{grid-column:1/-1}
  #toast{bottom:24px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(function () {
  var app = document.getElementById('app');
  function text(e, s) { e.textContent = s == null ? '' : String(s); return e; }
  function el(tag, cls, s) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (s != null) text(e, s);
    return e;
  }
  function add(parent) {
    for (var i = 1; i < arguments.length; i++) if (arguments[i]) parent.appendChild(arguments[i]);
    return parent;
  }
  function clear(e) { while (e.firstChild) e.removeChild(e.firstChild); return e; }

  var tg = window.Telegram && window.Telegram.WebApp;
  // Outside Telegram the page is a site: the Telegram Login Widget signs the
  // requests instead of initData, and its object is kept for 7 days, as long
  // as the functions accept it.
  var browser = !tg || !tg.initData;
  var login = null;
  var root = document.documentElement;
  // Inside Telegram the theme follows the app: data-theme from colorScheme,
  // --bg tinted a quarter of the way toward Telegram's own background, and
  // the same colour under Telegram's header. A browser follows the system.
  function mix(a, b, t) {
    if (!/^#[0-9a-f]{6}$/i.test(a) || !/^#[0-9a-f]{6}$/i.test(b || '')) return a;
    var out = '#';
    for (var i = 1; i < 7; i += 2) {
      var v = Math.round(parseInt(a.substr(i, 2), 16) * (1 - t) + parseInt(b.substr(i, 2), 16) * t);
      out += ('0' + v.toString(16)).slice(-2);
    }
    return out;
  }
  function theme() {
    root.setAttribute('data-theme', tg.colorScheme === 'light' ? 'light' : 'dark');
    var bg = mix(getComputedStyle(root).getPropertyValue('--bg0').trim(), (tg.themeParams || {}).bg_color, 0.25);
    root.style.setProperty('--bg', bg);
    try { tg.setHeaderColor(bg); } catch (e) {}
    try { tg.setBackgroundColor(bg); } catch (e) {}
  }
  if (browser) {
    try { login = JSON.parse(store('tgLogin') || 'null'); } catch (e) {}
    if (!login || !(Date.now() / 1000 - Number(login.auth_date) < 7 * 86400)) login = null;
  } else {
    try { tg.ready(); } catch (e) {}
    try { tg.expand(); } catch (e) {}
    theme();
    try { tg.onEvent('themeChanged', theme); } catch (e) {}
  }

  // The page is hosted off supabase.co, so the functions are named in full.
  var BASE = 'https://ssfkoyyhxqcmjokdxkpn.supabase.co/functions/v1/';
  var ERRORS = {
    closed: 'Уже закрыто', 'nothing selected': 'Ничего не отмечено', 'no such item': 'Уже убрано',
    'bad url': 'Нужна ссылка http(s) на товар', 'bad target': 'Цель — число больше нуля',
    'no such film': 'Нет такого фильма', 'no such row': 'Уже закрыто', 'bad date': 'Дата — сегодня или позже',
    'no title': 'Нужен текст', too_close: 'Срок уже завтра — отложить некуда', late: 'Поздно, уже не вернуть'
  };

  var toastEl = document.getElementById('toast');
  var toastTimer;
  function toast(s) {
    text(toastEl, s || 'Не получилось, попробуй ещё раз');
    toastEl.className = 'on';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.className = ''; }, 3000);
  }
  // «Убрал · Вернуть» for 10 s: the button brings the ids back, then `after`.
  function undoToast(s, ids, after) {
    var b = el('button', 'tl', 'Вернуть');
    b.type = 'button';
    b.onclick = function () {
      toastEl.className = '';
      api('telegram-webhook', { action: 'undo', ids: ids.join(',') }).then(after, noop);
    };
    add(clear(toastEl), document.createTextNode(s + ' · '), b);
    toastEl.className = 'on act';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.className = ''; }, 10000);
  }
  // The x-tg-login header: the login object's JSON as base64url (UTF-8).
  function b64url(s) {
    var bytes = new TextEncoder().encode(s), bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  // `body`, when given, goes as JSON.
  function api(fn, params, ms, quiet, body) {
    if (browser && !login) return Promise.reject(new Error('login'));
    var opts = {
      method: 'POST',
      headers: browser ? { 'x-tg-login': b64url(JSON.stringify(login)) } : { 'x-tma-init-data': tg.initData }
    };
    if (body) {
      opts.body = JSON.stringify(body);
      opts.headers['content-type'] = 'application/json';
    }
    if (window.AbortSignal && AbortSignal.timeout) opts.signal = AbortSignal.timeout(ms || 15000);
    return fetch(BASE + fn + '?' + new URLSearchParams(params), opts)
      .then(function (r) {
        return r.json().then(function (j) {
          if (!r.ok || (j && j.ok === false)) {
            var err = new Error((j && j.error) || String(r.status));
            err.code = j && j.error;
            // An expired or refused login: back to the card, no toast.
            if (r.status === 401 && browser) {
              err.login = true;
              if (login) loginCard('Сессия истекла, войди снова');
            }
            throw err;
          }
          return j;
        });
      })
      .catch(function (e) {
        if (!e.login && !quiet) toast(ERRORS[e && e.code]);
        throw e;
      });
  }

    try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
  }
  function store(k, v) {
    try {
      if (v === undefined) return localStorage.getItem(k);
      localStorage.setItem(k, v);
    } catch (e) {}
    return null;
  }
  function zl(v) {
    return v == null || v === '' ? '—' : Number(v).toFixed(2).replace('.', ',');
  }
  function dm(d) { return d ? d.slice(8, 10) + '.' + d.slice(5, 7) : ''; }
  // A timestamp as dd.mm in the phone's own time zone.
  function dmt(ts) {
    var d = new Date(ts);
    return isNaN(d) ? '' : ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2);
  }
  function plain(html) {
    return String(html || '').replace(/<[^>]*>/g, '')
      .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
  }
  function noop() {}

  // --- building blocks ---
  // A Lucide icon from the sprite in the body.
  function icon(name, cls) {
    return add(svg('svg', { 'class': 'i' + (cls ? ' ' + cls : ''), 'aria-hidden': 'true' }), svg('use', { href: '#i-' + name }));
  }
  // An icon and a label inside a button; called again to relabel it.
  function label(b, ic, s) {
    add(clear(b), ic ? icon(ic) : null, document.createTextNode(s));
    return b;
  }
  function mkCard(ic, title, sub) {
    return add(el('div', 'card'), add(el('div', 'ch'), add(el('span', 'ico'), icon(ic)), el('h3', '', title)),
      sub ? el('div', 'sub', sub) : null);
  }
  function pill(s, kind) { return el('span', 'pill' + (kind ? ' ' + kind : ''), s); }
  // A small icon in front of a row.
  function lead(r, ic) { r.insertBefore(add(el('span', 'lead'), icon(ic)), r.firstChild); return r; }
  // A JS twin of CATS in scripts/deal_batch.py: the same ids and keyword lists,

  var CAT_EMO = {};

  // Handwritten list items are mostly Russian: a second list for them, tried

    ['alcohol', ['пиво', 'вино', 'водк', 'виски', 'ликёр', 'ликер', 'просекко', 'сидр', 'джин', 'ром ']],

  function grouped(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }

  // The price history: a faint grid with its prices, the 90-day minimum

  // priced; dates at the start, middle and end, never on top of each other.
  // W is the card's width in px (less the svg's 8px side padding), so the drawing
  // is made to size and the 11px ticks stay 11px; H is fixed.
  function chart(rows, minLine, W) {

    var box = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'class': 'chart', 'aria-label': 'История цены' });
    if (!rows.length) return box;
    var ts = rows.map(function (r) { return Date.parse(r.observed_on + 'T00:00:00Z'); });
    var ps = rows.map(function (r) { return Number(r.price); });
    var t0 = Math.min.apply(null, ts), t1 = Math.max.apply(null, ts);
    var lo = Math.min.apply(null, ps), hi = Math.max.apply(null, ps);
    if (minLine != null) { lo = Math.min(lo, minLine); hi = Math.max(hi, minLine); }
    var pad = (hi - lo) * 0.1 || hi * 0.1 || 1;
    lo -= pad;
    hi += pad;

    function y(p) { return T + (hi - p) / (hi - lo) * (H - T - B); }

      add(box, svg('line', { x1: L, x2: W - R, y1: y(v), y2: y(v), 'class': i === 2 ? 'ax' : 'grid' }),
        svg('text', { x: L - 6, y: y(v) + 4, 'class': 'tk', 'text-anchor': 'end' }, zl(v)));
    });
    if (minLine != null) {
      add(box, svg('line', { x1: L, x2: W - R, y1: y(minLine), y2: y(minLine), 'class': 'minl' }));
    }
    var pts = rows.map(function (r, i) { return x(ts[i]).toFixed(1) + ',' + y(ps[i]).toFixed(1); });
    add(box, svg('polyline', { points: pts.join(' '), 'class': 'ln' }));
    var n = rows.length - 1;
    rows.forEach(function (r, i) {
      add(box, svg('circle', { cx: x(ts[i]), cy: y(ps[i]), r: i === n ? 5 : 3.5,
        'class': (SRC_CLASS[r.source] || 's-rc') + (i === n ? ' last' : '') }));
    });
    var lx = x(ts[n]), ly = y(ps[n]);
    add(box, svg('text', { x: lx > W - R - 30 ? lx - 8 : lx, y: ly - 10 < T ? ly + 18 : ly - 10, 'class': 'tk strong',
      'text-anchor': lx > W - R - 30 ? 'end' : 'middle' }, zl(ps[n])));

    var md = rows[mid].observed_on;
    if (rows.length > 2 && md !== rows[0].observed_on && md !== rows[n].observed_on &&

    });

    ['leaflet', 'aldi-json', 'receipt'].forEach(function (k) {

    });
    if (s.min_90d != null) add(legend, add(el('span'), el('i', 'dash'), document.createTextNode('мин 90 дн')));

  // Weekly spend as bars: the current week outlined, every few weeks dated,
  // the largest labelled over a faint line at its height.
  function weekChart(weeks, now, W) {
    W = W > 0 ? W : 320;
    var H = 150, L = 4, T = 18, B = 20, n = weeks.length || 1;
    var box = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'class': 'chart', 'aria-label': 'Траты по неделям' });
    var max = Math.max.apply(null, weeks.map(function (w) { return w.spent; }).concat([0]));
    var step = (W - 2 * L) / n, every = Math.max(2, Math.ceil(n / 7)), hi = -1;
    if (max > 0) add(box, svg('line', { x1: L, x2: W - L, y1: T, y2: T, 'class': 'grid' }));
    add(box, svg('line', { x1: L, x2: W - L, y1: H - B, y2: H - B, 'class': 'ax' }));
    weeks.forEach(function (w, i) {
      var h = max > 0 ? w.spent / max * (H - T - B) : 0, x = L + i * step + step * 0.15;
      var a = { x: x, y: H - B - h, width: step * 0.7, height: h, rx: 2, 'class': w.week_start === now ? 'b now' : 'b' };
      if (h > 0) add(box, svg('rect', a));
      if (hi < 0 || w.spent > weeks[hi].spent) hi = i;
      if ((n - 1 - i) % every === 0) {
        add(box, svg('text', { x: x + step * 0.35, y: H - 5, 'class': 'tk', 'text-anchor': 'middle' }, dm(w.week_start)));
      }
    });
    if (max > 0) {
      var cx = Math.min(Math.max(L + (hi + 0.5) * step, 26), W - 26);
      add(box, svg('text', { x: cx, y: T - 5, 'class': 'tk strong', 'text-anchor': 'middle' }, zl(max)));
    }
    return box;
  }

        chips(f.venue_ids, 'venue_ids', j.venues.map(function (v) { return [v.id, v.name, v.street]; })),
        chips(f.levels, 'levels', j.levels.map(function (l) { return [l.id, l.label]; })),
        add(chips(f.weekdays, 'weekdays', WEEK.map(function (w, i) { return [i, w]; })), sel)));
      clear(body);
      if (j.my_games.length) {
        var c = mkCard('ball', 'Мои игры');
        j.my_games.forEach(function (g) { c.appendChild(myGameRow(g)); });
        body.appendChild(c);
      }
      j.games.forEach(function (g) {
        var d = wd(g.date), price = g.price == null ? '' : (g.price % 1 ? zl(g.price) : g.price) + ' zł';
        if (!days[g.date]) {
          body.appendChild(days[g.date] = mkCard('calendar', WEEK[d] + ' ' + dm(g.date) +
            (f.priority_weekdays.indexOf(d) >= 0 ? ' 🔥' : '')));
        }
        var r = hrow(g.start_at + '–' + g.stop_at + ' · ' + g.venue + (g.verified_only ? ' 🪪' : ''),
          [lv[g.lv] || g.lv, 'занято ' + g.taken + '/' + g.max_players, price].filter(Boolean).join(' · '),
          g.mine ? pill('ты записан', 'acc') : g.busy ? pill('у тебя игра') : null, g.url);
        if (g.full) r.className += ' off';
        days[g.date].appendChild(r);
      });
      if (!j.games.length) body.appendChild(state('ball', 'Подходящих игр нет — переключи залы или уровни'));
    }
    function load() {
      if (!body.firstChild) add(body, skeleton(2));
      return api('miniapp', { action: 'volleyball' }, 25000, true).then(render, function (e) {
        if (!e.login && current === 'vb') failed(clear(body), load);
      });
    }
    load();
  }

  // --- dela ---
  // Everything open, from the webhook (?action=dela): overdue, the next 7
  // days, later. «Сделано» takes two taps, «Отложить» moves the reminders
  // three days on (dela_done, dela_snooze); «+ Срок» adds a deadline by hand
  // (deadline_add). The tab reloads after each.
  var DELA_ICON = { dl: '📄', pay: '🏦', pk: '📦', rt: '↩️', doc: '🪪', sub: '💳' };
  var DELA_KIND = { dl: 'свой срок', pay: 'платёж', pk: 'посылка', rt: 'возврат', doc: 'документ', sub: 'списание' };
  var DELA_DONE = { dl: 'Сделано', pay: 'Оплачено', pk: 'Забрал', rt: 'Оставляю' };
  var delaText = '', delaDue = '';
  function delaView() {
    var form = el('form'), bar1 = el('div', 'bar'), bar2 = el('div', 'bar');
    var what = el('input'), when = el('input');
    var p = wp(Date.now()), today = p.year + '-' + p.month + '-' + p.day;
    what.placeholder = 'Что сделать';
    what.setAttribute('aria-label', 'Что сделать');
    what.maxLength = 80;
    what.value = delaText;
    what.oninput = function () { delaText = what.value; };
    when.type = 'date';
    when.min = today;
    when.setAttribute('aria-label', 'Дата срока');
    when.value = delaDue;
    when.oninput = function () { delaDue = when.value; };
    var go = label(el('button', 'btn'), 'plus', 'Срок');
    go.type = 'submit';
    form.onsubmit = function (ev) {
      ev.preventDefault();
      var t = what.value.trim(), d = when.value;
      if (!t || !d) return toast('Нужны текст и дата');
      if (d < today) return toast(ERRORS['bad date']);
      go.disabled = true;
      haptic();
      api('telegram-webhook', { action: 'deadline_add', title: t, date: d }).then(function (j) {
        go.disabled = false;
        toast('📄 ' + j.title + ' · ' + dm(j.due) + ' — напомню за 7 и за 1 день');
        delaText = delaDue = what.value = when.value = '';
        load();
      }, function () { go.disabled = false; });
    };
    var body = el('div', 'cols');
    add(main, add(form, add(bar1, add(el('label', 'field'), icon('file'), what)),
      add(bar2, add(el('label', 'field'), icon('calendar'), el('span', 'mu', 'дата срока'), when), go)), body);
    var armed = null, armTimer = null;

    function disarm() {
      clearTimeout(armTimer);
      armTimer = null;
      if (armed) { label(armed, 'check', 'Сделано'); armed.className = 'pg'; }
      armed = null;
    }
    function act(params, done) {
      haptic();
      api('telegram-webhook', params).then(function (j) { toast(done(j)); load(); }, function (e) {
        if (e.code === 'no such row') load();
      });
    }
    function btn(ic, s, fn) {
      var b = label(el('button', 'pg'), ic, s);
      b.type = 'button';
      b.onclick = fn;
      return b;
    }
    function left(n) { return n < 0 ? 'просрочено ' + -n + ' дн' : n === 0 ? 'сегодня' : 'через ' + n + ' дн'; }
    function row(i) {
      var tile = el('span', 'ptile', DELA_ICON[i.kind] || '📌');
      tile.setAttribute('aria-hidden', 'true');
      var acts = el('div', 'acts');
      if (i.can_done) {
        var done = btn('check', 'Сделано', function () {
          if (armed !== done) {
            disarm();
            armed = done;
            label(done, null, 'Точно?');
            done.className = 'pg warn';
            armTimer = setTimeout(disarm, 3000);
            return;
          }
          disarm();
          act({ action: 'dela_done', kind: i.kind, id: i.id }, function () { return DELA_DONE[i.kind]; });
        });
        acts.appendChild(done);
      }
      if (i.can_snooze) {
        acts.appendChild(btn('clock', 'Отложить', function () {
          act({ action: 'dela_snooze', kind: i.kind, id: i.id }, function (j) { return 'Отложено до ' + dm(j.snoozed_until); });
        }));
      }
      return add(el('div', 'row dela'), tile, add(el('span', 'tx'),
        el('div', 't', i.title),
        add(el('div', 'mu num', (i.sub || DELA_KIND[i.kind]) + ' · ' + (i.approx ? '≈' : '') + dm(i.due)),
          i.snoozed_until ? pill('⏰ до ' + dm(i.snoozed_until)) : null)),
        add(el('span', 'pr'), pill(left(i.days), i.days <= 3 ? 'bad' : '')), acts.firstChild ? acts : null);
    }
    function render(items) {
      // A re-render replaces the buttons, so an armed «Точно?» must not survive it.
      clearTimeout(armTimer);
      armed = armTimer = null;
      if (current !== 'dela') return;
      clear(body);
      if (!items.length) {
        add(body, state('check', 'Открытых дел нет 👌'));
        try { what.focus(); } catch (e) {}
        return;
      }
      [['alert', 'Просрочено', function (n) { return n < 0; }],
        ['calendar', 'Ближайшие 7 дней', function (n) { return n >= 0 && n <= 7; }],
        ['clock', 'Потом', function (n) { return n > 7; }]].forEach(function (b) {
        var rows = items.filter(function (i) { return b[2](i.days); });
        if (!rows.length) return;
        var c = mkCard(b[0], b[1]);
        c.firstChild.appendChild(pill(String(rows.length), b[1] === 'Просрочено' ? 'bad' : ''));
        rows.forEach(function (i) { c.appendChild(row(i)); });
        body.appendChild(c);
      });
    }
    function load() {
      if (!body.firstChild) add(body, skeleton(2));
      api('telegram-webhook', { action: 'dela' }, undefined, true).then(function (j) { render(j.items || []); }, function (e) {
        if (!e.login && current === 'dela') failed(body, load);
      });
    }
    load();
  }

  // --- news feed ---
  var STREAMS = [['all', 'все'], ['city', 'Варшава'], ['transport', 'транспорт'], ['legal', 'легализация']];
  var SOURCES = {
    'infor-legal': 'infor.pl', udsc: 'UdSC', muw: 'MUW', warszawa: 'warszawa.pl', wtp: 'WTP', ukrinform: 'Ukrinform'
  };
  function feedView() {
    var stream = store('stream');
    if (!/^(all|city|transport|legal)$/.test(stream)) stream = 'all';
    var seg = el('div', 'seg fit'), body = el('div'), segs = {}, med = el('div');
    seg.setAttribute('role', 'group');
    seg.setAttribute('aria-label', 'Поток');
    STREAMS.forEach(function (s) {
      var b = segs[s[0]] = el('button', '', s[1]);
      b.type = 'button';
      b.onclick = function () { stream = s[0]; store('stream', stream); load(); };
      seg.appendChild(b);
    });
    add(main, med, seg, body);

    // «Медицина»: current promotions from the med function's table, worded
    // as /med words them; hidden when there are none.
    function money(v) { var n = Number(v); return Number.isInteger(n) ? String(n) : zl(n); }
    api('miniapp', { action: 'med' }, undefined, true).then(function (j) {
      var rows = (j.rows || []).slice(0, 8);
      if (current !== 'feed' || !rows.length) return;
      var card = mkCard('steth', 'Медицина');
      rows.forEach(function (r) {
        var a = el('a', 'lnk', r.title);
        if (/^https?:\/\//i.test(r.url)) a.href = r.url;
        a.onclick = function (ev) { ev.preventDefault(); openLink(r.url); };
        var dt = r.discount_text ? String(r.discount_text).replace(/^-/, '−') : '';
        var deal = dt ? dt + (r.code ? ' по коду ' + r.code : '') : r.code ? 'по коду ' + r.code : '';
        var rest = (r.price != null ? ' — ' + money(r.price) + ' zł' : '') + (deal ? ' · ' + deal : '') +
          (r.valid_to ? ' · до ' + dm(r.valid_to) : '');
        card.appendChild(add(el('div', 'row'), add(el('span', 'tx'), document.createTextNode(r.provider + ' · '), a,
          document.createTextNode(rest))));
      });
      med.appendChild(card);
    }, noop);

    function render(rows) {
      clear(body);
      if (!rows.length) return add(body, state('news', 'Новостей пока нет'));
      var card = el('div', 'card');
      rows.forEach(function (r) {
        var p = r.published_at ? wp(r.published_at) : null;
        var row = el('div', 'row'), tx = el('span', 'tx');
        add(tx, el('b', '', r.title), r.summary ? el('div', 'mu clip', r.summary) : null,
          el('div', 'mu', (SOURCES[r.source] || r.source) + ' · ' + (p ? p.day + '.' + p.month : '—')));
        if (/^https?:\/\//i.test(r.url)) tap(row, function () { openLink(r.url); });
        card.appendChild(add(row, tx));
      });
      body.appendChild(card);
    }
    function load() {
      for (var k in segs) segs[k].className = k === stream ? 'on' : '';
      var mine = stream;
      add(clear(body), skeleton(1));
      api('miniapp', { action: 'news', stream: stream }, undefined, true).then(function (j) {
        if (current === 'feed' && mine === stream) render(j.rows || []);
      }, function (e) { if (!e.login && current === 'feed' && mine === stream) failed(body, load); });
    }
    load();
  }

  // --- changelog ---
  // changelog.json is published next to the page; the publish script stamps
  // the page's own date into <meta name="published">.
  function newsView() {
    var body = add(el('div'), skeleton(2)), meta = document.querySelector('meta[name="published"]');
    add(main, body, el('p', 'mu', 'страница: ' + ((meta && meta.content) || 'не опубликована')));
    fetch('./changelog.json', { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    }).then(function (list) {
      if (current !== 'news') return;
      clear(body);
      list.forEach(function (e) {
        var ul = el('ul');
        e.lines.forEach(function (l) { ul.appendChild(el('li', '', l)); });
        body.appendChild(add(mkCard('sparkles', dm(e.date) + '.' + e.date.slice(0, 4) + ' · ' + e.title), ul));
      });
    }).catch(function () {
      if (current === 'news') {
        add(clear(body), state('alert', 'Список обновлений недоступен', 'Повторить', function () { show('news'); }));
      }
    });
  }

  function isView(t) { return Object.prototype.hasOwnProperty.call(VIEWS, t); }
  var VIEWS = {
    home: homeView, list: listView, picks: picksView, prices: pricesView, stats: statsView, wish: wishView,
    cinema: cinemaView, dela: delaView, feed: feedView, news: newsView, vb: vbView
  };
  if (browser && !login) loginCard();
  else start();
})();
</script>
</body>
</html>
