<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="published" content="2026-10-10 22:04">
<title>Помощник</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0f171f;--fg:#e6edf3;--mu:#8b98a5;--ac:#c1f354;--card:#162130;--line:#223040}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;padding:0 12px calc(24px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:2;background:var(--bg);padding:10px 0 8px}
.tabs{display:flex;gap:4px;background:var(--card);border-radius:12px;padding:4px}
.tabs button{flex:1;min-width:0;min-height:44px;padding:2px;border:0;border-radius:9px;background:none;color:var(--mu);font-weight:600;font-size:12px;line-height:1.15;white-space:nowrap;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tabs button .em{font-size:17px}
@media (max-width:519px){.tabs button .lb{display:none}.tabs button .em{font-size:20px}.top button.on{flex:2.4}.tabs button.on .lb{display:block}}
@media (max-width:399px){.top .tabs{gap:2px}}
.seg{margin-bottom:10px}
.fit button{flex:auto}
.big{padding:0 12px 4px;font-size:30px;font-weight:700}
.meter{height:6px;margin:5px 0 3px;border-radius:3px;background:var(--line)}
.meter i{display:block;height:100%;border-radius:3px;background:var(--ac)}
.card ul{margin:0;padding:0 12px 12px 30px}
.card li{margin:4px 0}
.tabs button.on{background:var(--ac);color:var(--bg)}
.head{color:var(--mu);font-size:14px;margin:6px 2px 8px}
.bar{display:flex;gap:8px;margin-bottom:10px}
.bar input{flex:1;min-width:0;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);outline:none}
.bar input:focus{border-color:var(--ac)}
.bar button,.btn{min-height:44px;min-width:44px;padding:0 14px;border:0;border-radius:10px;background:var(--ac);color:var(--bg);font-weight:700}
.btn.ghost{background:var(--card);color:var(--fg);border:1px solid var(--line);font-weight:600}
.btn.warn{background:#3a2a1a;color:#ffcf7a;border:1px solid #6a4a20}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.card h3{margin:0;padding:12px 12px 4px;font-size:16px}
.card h3:last-child{padding-bottom:12px}
.card .sub{padding:0 12px 8px;color:var(--mu);font-size:14px}
.row{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 12px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row .mk{flex:none;width:24px;text-align:center}
.row .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.row .pr{flex:none;text-align:right;font-variant-numeric:tabular-nums}
.row .old{color:var(--mu);text-decoration:line-through;font-size:13px;display:block}
.row.done .tx{color:var(--mu);text-decoration:line-through}
.row.soon{background:rgba(255,92,92,.14)}
.clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mu{color:var(--mu);font-size:14px}
.foot{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.foot .btn{flex:1}
.empty{color:var(--mu);text-align:center;padding:32px 12px}
.acc{color:var(--ac);font-weight:600}
svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;padding:0 12px 10px;color:var(--mu);font-size:13px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.lnk{color:var(--ac);font-weight:600;text-decoration:none}
.row .x{flex:none;padding:0 10px}
.btn.wide{width:100%}
#toast{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));background:#2a3a4c;color:var(--fg);border-radius:10px;padding:12px 14px;text-align:center;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:5}
#toast.on{opacity:1;transform:none}
#app{max-width:860px;margin:0 auto}
.tabs button.out{flex:none;padding:2px 10px}
.login{max-width:420px;margin:15vh auto 0;text-align:center}
.login .widget{min-height:56px;padding:8px 12px 16px}
@media (min-width:900px){.cols{display:grid;grid-template-columns:1fr 1fr;column-gap:12px;align-items:start}.cols>.empty{grid-column:1/-1}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
(function () {
  var app = document.getElementById('app');
  function text(e, s) { e.textContent = s == null ? '' : String(s); return e; }
  function el(tag, cls, s) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (s != null) text(e, s);
    return e;
  }
  function add(parent) {
    for (var i = 1; i < arguments.length; i++) if (arguments[i]) parent.appendChild(arguments[i]);
    return parent;
  }
  function clear(e) { while (e.firstChild) e.removeChild(e.firstChild); return e; }

  var tg = window.Telegram && window.Telegram.WebApp;
  // Outside Telegram the page is a site: the Telegram Login Widget signs the
  // requests instead of initData, and its object is kept for 7 days, as long
  // as the functions accept it.
  var browser = !tg || !tg.initData;
  var login = null;
  if (browser) {
    try { login = JSON.parse(store('tgLogin') || 'null'); } catch (e) {}
    if (!login || !(Date.now() / 1000 - Number(login.auth_date) < 7 * 86400)) login = null;
  } else {
    try { tg.ready(); } catch (e) {}
    try { tg.expand(); } catch (e) {}
    try { tg.setHeaderColor('#0f171f'); } catch (e) {}
    try { tg.setBackgroundColor('#0f171f'); } catch (e) {}
  }

  // The page is hosted off supabase.co, so the functions are named in full.
  var BASE = 'https://ssfkoyyhxqcmjokdxkpn.supabase.co/functions/v1/';
  var ERRORS = {
    closed: 'Уже закрыто', 'nothing selected': 'Ничего не отмечено', 'no such item': 'Уже убрано',
    'bad url': 'Нужна ссылка http(s) на товар', 'bad target': 'Цель — число больше нуля'
  };

  var toastEl = document.getElementById('toast');
  var toastTimer;
  function toast(s) {
    text(toastEl, s || 'Не получилось, попробуй ещё раз');
    toastEl.className = 'on';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.className = ''; }, 3000);
  }
  // The x-tg-login header: the login object's JSON as base64url (UTF-8).
  function b64url(s) {
    var bytes = new TextEncoder().encode(s), bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function api(fn, params, ms, quiet) {
    if (browser && !login) return Promise.reject(new Error('login'));
    var opts = {
      method: 'POST',
      headers: browser ? { 'x-tg-login': b64url(JSON.stringify(login)) } : { 'x-tma-init-data': tg.initData }
    };
    if (window.AbortSignal && AbortSignal.timeout) opts.signal = AbortSignal.timeout(ms || 15000);
    return fetch(BASE + fn + '?' + new URLSearchParams(params), opts)
      .then(function (r) {
        return r.json().then(function (j) {
          if (!r.ok || (j && j.ok === false)) {
            var err = new Error((j && j.error) || String(r.status));
            err.code = j && j.error;
            // An expired or refused login: back to the card, no toast.
            if (r.status === 401 && browser) {
              err.login = true;
              if (login) loginCard('Сессия истекла, войди снова');
            }
            throw err;
          }
          return j;
        });
      })
      .catch(function (e) {
        if (!e.login && !quiet) toast(ERRORS[e && e.code]);
        throw e;
      });
  }
  function haptic() {
    try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
  }
  function store(k, v) {
    try {
      if (v === undefined) return localStorage.getItem(k);
      localStorage.setItem(k, v);
    } catch (e) {}
    return null;
  }
  function zl(v) {
    return v == null || v === '' ? '—' : Number(v).toFixed(2).replace('.', ',');
  }
  function dm(d) { return d ? d.slice(8, 10) + '.' + d.slice(5, 7) : ''; }
  // A timestamp as dd.mm in the phone's own time zone.
  function dmt(ts) {
    var d = new Date(ts);
    return isNaN(d) ? '' : ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2);
  }
  function plain(html) {
    return String(html || '').replace(/<[^>]*>/g, '')
      .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
  }
  function noop() {}

  // --- tabs ---
  var TABS = [['home', '🏠', 'Сегодня'], ['list', '🛒', 'Список'], ['picks', '🏷️', 'Акции'], ['prices', '📈', 'Цены'],
    ['stats', '📊', 'Статистика'], ['wish', '🎁', 'Вишлист'], ['feed', '📰', 'Новости'], ['news', '🆕', 'Что нового']];
  var top = el('div', 'top');
  var tabs = el('div', 'tabs');
  var main = el('div');
  var buttons = {};
  var current = null;
  TABS.forEach(function (t) {
    var b = add(el('button'), el('span', 'em', t[1]), el('span', 'lb', t[2]));
    b.type = 'button';
    b.title = t[2];
    b.onclick = function () { show(t[0]); };
    buttons[t[0]] = b;
    tabs.appendChild(b);
  });
  if (browser) {
    var out = el('button', 'out', 'выйти');
    out.type = 'button';
    out.onclick = function () { loginCard(); };
    tabs.appendChild(out);
  }
  add(top, tabs);

  function start() {
    add(clear(app), top, main);
    show(store('tab') || 'home');
  }
  // The login card: the widget's script is created here, after load, so it
  // mounts its button in place of itself.
  function loginCard(note) {
    login = null;
    store('tgLogin', '');
    current = null;
    hideBack();
    clear(main);
    var widget = document.createElement('script');
    widget.async = true;
    widget.src = 'https://telegram.org/js/telegram-widget.js?22';
    widget.setAttribute('data-telegram-login', 'valerii_assistant_bot');
    widget.setAttribute('data-size', 'large');
    widget.setAttribute('data-userpic', 'false');
    widget.setAttribute('data-request-access', 'write');
    widget.setAttribute('data-onauth', 'onTelegramAuth(user)');
    add(clear(app), add(el('div', 'card login'), el('h3', '', 'Помощник'),
      el('div', 'sub', note || 'Войди через Telegram — пускает только владельца бота'),
      add(el('div', 'widget'), widget)));
  }
  window.onTelegramAuth = function (user) {
    login = user;
    store('tgLogin', JSON.stringify(user));
    start();
  };

  function show(tab) {
    if (!VIEWS[tab]) tab = 'home';
    current = tab;
    store('tab', tab);
    for (var k in buttons) buttons[k].className = k === tab ? 'on' : '';
    hideBack();
    clear(main);
    VIEWS[tab]();
  }

  // --- today ---
  // Wording follows the morning and weekly functions (renderDeadlines,
  // renderGenshin, the Sunday report).
  var WEEK = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'];
  var KINDS = { new: 'новых игр', freed: 'освободилось мест', list: 'списков', digest: 'сводок' };
  // Shortcuts' workout types, by a word of the name, as the morning brief names them.
  var WORKOUTS = [[/volleyball/i, '🏐 Волейбол'], [/tennis/i, '🎾 Теннис'], [/running/i, '🏃 Бег'],
    [/walking/i, '🚶 Ходьба'], [/cycling/i, '🚴 Велосипед'], [/strength/i, '🏋️ Силовая'], [/^other$/i, '🏅 Другое']];
  function grouped(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
  function sleepLine(min) { return Math.floor(min / 60) + ' ч ' + ('0' + min % 60).slice(-2) + ' мин'; }
  // Year, month, day, hour and minute of a moment in Warsaw.
  function wp(ts) {
    var o = {};
    new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Europe/Warsaw', hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit'
    }).formatToParts(new Date(ts)).forEach(function (x) { o[x.type] = x.value; });
    return o;
  }
  function whenW(ts) { var p = wp(ts); return p.day + '.' + p.month + ' ' + p.hour + ':' + p.minute; }
  function wd(date) { return (new Date(date + 'T12:00:00Z').getUTCDay() + 6) % 7; }
  function days(from, to) { return Math.round((Date.parse(to) - Date.parse(from)) / 86400000); }
  function addDays(date, n) { return new Date(Date.parse(date + 'T12:00:00Z') + n * 86400000).toISOString().slice(0, 10); }
  function plural(n, f) {
    var m10 = n % 10, m100 = n % 100;
    return m10 === 1 && m100 !== 11 ? f[0] : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? f[1] : f[2];
  }
  function receiptsLine(n, total, disc) {
    return n + ' ' + plural(n, ['чек', 'чека', 'чеков']) + ' · ' + zl(total) + ' zł' +
      (disc ? ' · скидки ' + zl(Math.abs(disc)) + ' zł' : '');
  }
  function hrow(main, sub, right, href) {
    var r = el('div', 'row');
    add(r, add(el('span', 'tx'), el('span', '', main), sub ? el('div', 'mu', sub) : null),
      right != null ? el('span', 'pr', right) : null);
    if (href) r.onclick = function () { openLink(href); };
    else r.style.cursor = 'default';
    return r;
  }
  function capped(rows, n) {
    return rows.length > n ? rows.slice(0, n).concat([el('div', 'row mu', '+' + (rows.length - n) + ' ещё')]) : rows;
  }

  function homeView() {
    var head = el('div', 'head', '…');
    var body = el('div', 'cols');
    var again = el('button', 'btn ghost wide', '🔄 Обновить');
    again.type = 'button';
    again.onclick = function () { window.scrollTo(0, 0); load(); };
    add(main, head, body, again);

    function card(title, sub, rows) {
      var c = add(el('div', 'card'), el('h3', '', title), sub ? el('div', 'sub', sub) : null);
      (rows || []).forEach(function (r) { c.appendChild(r); });
      body.appendChild(c);
    }
    function down(title) { card(title + ' — недоступно'); }
    function morning(m, today) {
      // Google Calendar today and tomorrow, from the mail bridge; hidden when
      // empty or the key is missing (an older morning). An event begun on an
      // earlier day is today's: «до 01:00» when it ends today, else all day.
      if (m.calendar === null) down('📅 Календарь');
      else if (m.calendar && m.calendar.length) {
        card('📅 Календарь', null, capped(m.calendar.map(function (e) {
          var p = wp(e.starts_at), date = p.year + '-' + p.month + '-' + p.day;
          var q = e.ends_at && wp(e.ends_at), end = q && q.year + '-' + q.month + '-' + q.day;
          var ongoing = date < today;
          var time = e.all_day || (ongoing && end !== today) ? 'весь день' : ongoing ? 'до ' + q.hour + ':' + q.minute : p.hour + ':' + p.minute;
          if (!e.all_day && !ongoing && e.ends_at && e.ends_at !== e.starts_at) time += '–' + q.hour + ':' + q.minute;
          return hrow(e.title || 'без названия', [ongoing || date === today ? 'сегодня' : WEEK[wd(date)] + ' ' + dm(date), time,
            e.location].filter(Boolean).join(' · '));
        }), 6));
      }

      if (!m.deadlines && !m.payments && !m.parcels) down('📅 Сроки и посылки');
      else {
        var due = [];
        var rel = function (d) {
          var n = days(today, d);
          return n < 0 ? 'просрочено' : n === 0 ? 'сегодня' : n === 1 ? 'завтра' : 'через ' + n + ' дн';
        };
        if (m.deadlines) {
          m.deadlines.forEach(function (d) {
            due.push(hrow(d.title, d.sender + ' · до ' + dm(d.due_date) + ' · ' + rel(d.due_date)));
          });
        } else due.push(hrow('сроки из писем — недоступно'));
        if (m.payments) {
          m.payments.forEach(function (p) {
            due.push(hrow(p.kind + ' · ' + p.period, 'до ' + dm(p.due_date) + ' · ' + rel(p.due_date)));
          });
        } else due.push(hrow('платежи — недоступно'));
        if (m.parcels) {
          m.parcels.forEach(function (p) {
            due.push(hrow('📦 ' + [p.carrier, p.shop].filter(Boolean).join(' · '),
              'забрать до ' + whenW(p.pickup_deadline)));
          });
        } else due.push(hrow('посылки — недоступно'));
        if (due.length) card('📅 Сроки и посылки', null, capped(due, 8));
      }

      // Documents within 90 days (the morning loader's window); red at 7 days
      // or less. The key is missing while an older morning function is deployed.
      if (m.documents === null) down('📄 Документы');
      else if (m.documents && m.documents.length) {
        card('📄 Документы', null, m.documents.map(function (d) {
          var n = days(today, d.expires_on);
          var r = hrow(d.name, (n < 0 ? 'просрочено ' + (-n) + ' дн' : n === 0 ? 'сегодня' : 'через ' + n + ' дн') +
            ' · ' + dm(d.expires_on) + '.' + d.expires_on.slice(0, 4));
          if (n <= 7) r.className += ' soon';
          return r;
        }));
      }

      if (!m.courts) down('🎾 Корты сегодня');
      else {
        // Slots that have not started yet, earliest first, then cheapest.
        var names = {}, now = wp(Date.now()), hm = now.hour + ':' + now.minute;
        m.courts.clubs.forEach(function (c) { names[c.slug] = c.name; });
        var slots = m.courts.slots.filter(function (s) { return names[s.slug] && s.start_time >= hm; })
          .sort(function (x, y) { return x.start_time.localeCompare(y.start_time) || Number(x.price) - Number(y.price); });
        if (slots.length) {
          card('🎾 Корты сегодня', null, capped(slots.map(function (s) {
            return hrow(s.start_time + ' · ' + names[s.slug], null, zl(s.price) + ' zł',
              'https://playmore.pl/klub/' + s.slug + '/');
          }), 6));
        }
      }

      // Own games from PNH mails, the week ahead; the key is missing while an
      // older morning function is deployed.
      if (m.my_games === null) down('🏐 Мои игры');
      else if (m.my_games && m.my_games.length) {
        card('🏐 Мои игры', null, m.my_games.map(function (g) {
          var s = wp(g.starts_at), date = s.year + '-' + s.month + '-' + s.day, time = s.hour + ':' + s.minute;
          if (g.ends_at) time += '–' + wp(g.ends_at).hour + ':' + wp(g.ends_at).minute;
          return hrow([WEEK[wd(date)] + ' ' + dm(date), time, [g.venue, g.address].filter(Boolean).join(', '),
            g.status === 'paid' ? 'оплачено' : 'записан'].filter(Boolean).join(' · '), null, null,
            g.activity_id > 0 ? 'https://pilkanahali.pl/zajecia/' + g.activity_id : null);
        }));
      }

      // Cinema City screenings today and tomorrow, from the purchase mails;
      // hidden when there are none or the key is missing (an older morning).
      if (m.my_shows === null) down('🍿 Мои сеансы');
      else if (m.my_shows && m.my_shows.length) {
        card('🍿 Мои сеансы', null, m.my_shows.map(function (s) {
          var p = wp(s.starts_at), date = p.year + '-' + p.month + '-' + p.day;
          return hrow(s.film, [date === today ? 'сегодня' : WEEK[wd(date)] + ' ' + dm(date), p.hour + ':' + p.minute,
            [s.cinema, s.hall].filter(Boolean).join(', ')].join(' · '));
        }));
      }

      if (!m.volleyball) down('🏐 Волейбол');
      else if (m.volleyball.length) {
        // 🔥 on ср/пт, the priority evenings, as the volleyball digest marks them.
        var day = (wd(today) === 2 || wd(today) === 4 ? '🔥 ' : '') + WEEK[wd(today)] + ' ' + dm(today) + ' ';
        card('🏐 Волейбол', 'свободных игр сегодня: ' + m.volleyball.length, capped(m.volleyball.slice()
          .sort(function (x, y) { return x.start_at.localeCompare(y.start_at); })
          .map(function (g) {
            var taken = g.max_players != null && g.free_spots != null
              ? (g.max_players - g.free_spots) + '/' + g.max_players : '';
            return hrow([day + g.start_at, g.venue, taken].filter(Boolean).join(' · '), null,
              g.price == null ? null : zl(g.price) + ' zł', 'https://pilkanahali.pl/zajecia/' + g.activity_id);
          }), 6));
      }

      if (!m.genshin) down('🎮 Genshin');
      else if (m.genshin.length) {
        card('🎮 Genshin · заканчивается', null, m.genshin.slice()
          .sort(function (x, y) { return Date.parse(x.ends_at) - Date.parse(y.ends_at); }).slice(0, 5)
          .map(function (r) {
            return hrow(r.title || r.item_id, 'до ' + whenW(r.ends_at), null,
              'https://www.hoyolab.com/article/' + r.item_id);
          }));
      }

      // Yesterday from the Shortcuts automation; hidden when it did not post
      // or the key is missing (an older morning).
      var h = m.health;
      if (h) {
        var ws = h.workouts || [], timed = ws.filter(function (w) { return w.minutes != null; });

  function svg(tag, attrs, s) {
    var e = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (s != null) text(e, s);
    return e;
  }
  function chart(rows, minLine) {
    var W = 320, H = 170, L = 40, R = 10, T = 10, B = 24;
    var box = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img' });
    if (!rows.length) return box;
    var ts = rows.map(function (r) { return Date.parse(r.observed_on + 'T00:00:00Z'); });
    var ps = rows.map(function (r) { return Number(r.price); });
    var t0 = Math.min.apply(null, ts), t1 = Math.max.apply(null, ts);
    var lo = Math.min.apply(null, ps), hi = Math.max.apply(null, ps);
    if (minLine != null) { lo = Math.min(lo, minLine); hi = Math.max(hi, minLine); }
    var pad = (hi - lo) * 0.1 || hi * 0.1 || 1;
    lo -= pad;
    hi += pad;
    function x(t) { return t1 === t0 ? (L + W - R) / 2 : L + (t - t0) / (t1 - t0) * (W - L - R); }
    function y(p) { return T + (hi - p) / (hi - lo) * (H - T - B); }
    add(box,
      svg('line', { x1: L, x2: W - R, y1: H - B, y2: H - B, stroke: '#223040' }),
      svg('text', { x: L - 4, y: T + 8, fill: '#8b98a5', 'font-size': 10, 'text-anchor': 'end' }, zl(hi)),
      svg('text', { x: L - 4, y: H - B, fill: '#8b98a5', 'font-size': 10, 'text-anchor': 'end' }, zl(lo)));
    if (minLine != null) {
      add(box, svg('line', { x1: L, x2: W - R, y1: y(minLine), y2: y(minLine), stroke: '#c1f354',
        'stroke-dasharray': '4 3', 'stroke-opacity': 0.7 }));
    }
    var pts = rows.map(function (r, i) { return x(ts[i]).toFixed(1) + ',' + y(ps[i]).toFixed(1); });
    add(box, svg('polyline', { points: pts.join(' '), fill: 'none', stroke: '#8b98a5', 'stroke-width': 1.5 }));
    rows.forEach(function (r, i) {
      add(box, svg('circle', { cx: x(ts[i]), cy: y(ps[i]), r: 3.5, fill: COLOR[r.source] || '#ffffff' }));
    });
    var mid = rows.length >> 1;
    var labels = [[0, 'start'], [rows.length - 1, 'end']];
    var md = rows[mid].observed_on;
    if (rows.length > 2 && md !== rows[0].observed_on && md !== rows[rows.length - 1].observed_on) {
      labels.splice(1, 0, [mid, 'middle']);
    }
    if (t1 === t0) labels = [[0, 'middle']];
    labels.forEach(function (l) {
      var xx = l[1] === 'start' ? L : l[1] === 'end' ? W - R : x(ts[l[0]]);
      add(box, svg('text', { x: xx, y: H - 8, fill: '#8b98a5', 'font-size': 10, 'text-anchor': l[1] },
        dm(rows[l[0]].observed_on)));
    });
    return box;
  }
  function drawProduct(card, rows, s) {

  // Weekly spend as bars: the current week outlined, every few weeks dated,
  // the largest labelled.
  function weekChart(weeks, now) {
    var W = 320, H = 150, L = 4, T = 16, B = 20, n = weeks.length || 1;
    var box = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img' });
    var max = Math.max.apply(null, weeks.map(function (w) { return w.spent; }).concat([0]));
    var step = (W - 2 * L) / n, every = Math.max(2, Math.ceil(n / 7)), hi = -1;
    add(box, svg('line', { x1: L, x2: W - L, y1: H - B, y2: H - B, stroke: '#223040' }));
    weeks.forEach(function (w, i) {
      var h = max > 0 ? w.spent / max * (H - T - B) : 0, x = L + i * step + step * 0.15;
      var a = { x: x, y: H - B - h, width: step * 0.7, height: h, rx: 2, fill: '#c1f354' };
      if (w.week_start === now) { a['fill-opacity'] = 0.3; a.stroke = '#c1f354'; }
      if (h > 0) add(box, svg('rect', a));
      if (hi < 0 || w.spent > weeks[hi].spent) hi = i;
      if ((n - 1 - i) % every === 0) {
        add(box, svg('text', { x: x + step * 0.35, y: H - 6, fill: '#8b98a5', 'font-size': 10, 'text-anchor': 'middle' },
          dm(w.week_start)));
      }
    });
    if (max > 0) {
      var cx = Math.min(Math.max(L + (hi + 0.5) * step, 24), W - 24);
      add(box, svg('text', { x: cx, y: T - 4, fill: '#e6edf3', 'font-size': 10, 'text-anchor': 'middle' }, zl(max)));
    }
    return box;
  }

  // --- wishlist ---
  var WISH_STATUS = { watching: 'слежу', reached: '🎯 цель достигнута', unknown: 'цена не читается' };
  var wishUrl = '', wishTarget = '';
  function openLink(url) {
    if (!/^https?:\/\//i.test(String(url))) return;
    if (browser) return window.open(url, '_blank', 'noopener');
    try { tg.openLink(url); } catch (e) { window.open(url, '_blank'); }
  }
  function wishView() {
    var form = el('form');
    var bar1 = el('div', 'bar'), bar2 = el('div', 'bar');
    var url = el('input'), target = el('input');
    url.type = 'url';
    url.placeholder = 'Ссылка на товар';
    url.value = wishUrl;
    url.oninput = function () { wishUrl = url.value; };
    target.placeholder = 'Цель, zł';
    target.setAttribute('inputmode', 'decimal');
    target.value = wishTarget;
    target.oninput = function () { wishTarget = target.value; };
    var go = el('button', '', 'Следить');
    go.type = 'submit';
    form.onsubmit = function (ev) {
      ev.preventDefault();
      var u = url.value.trim(), t = target.value.replace(/\s/g, '');
      if (!u || !t) return toast('Нужны ссылка и цель');
      go.disabled = true;
      api('telegram-webhook', { action: 'wish_add', url: u, target: t }).then(function (j) {
        go.disabled = false;
        var host = u;
        try { host = new URL(u).hostname; } catch (e) {}
        toast('Слежу: ' + (j.title || host) + (j.price != null ? ' · сейчас ' + zl(j.price) + ' zł' : ''));
        wishUrl = wishTarget = url.value = target.value = '';
        load();
      }, function (e) {
        go.disabled = false;
        if (e.code) toast(ERRORS[e.code] || e.code);
        else load(); // a slow shop can outlast the timeout and still be added
      });
    };
    var body = el('div');
    add(main, add(form, add(bar1, url), add(bar2, target, go)), body);
    var rows = [];
    var armed = null, armTimer = null;

    function disarm() {
      clearTimeout(armTimer);
      armTimer = null;
      if (armed) { text(armed, '❌'); armed.className = 'btn ghost x'; }
      armed = null;
    }
    function render() {
      // A re-render replaces the buttons, so an armed «Точно?» must not survive it.
      clearTimeout(armTimer);
      armed = armTimer = null;
      if (current !== 'wish') return;
      clear(body);
      if (!rows.length) return add(body, el('p', 'empty', 'Пусто. Вставь ссылку и цель.'));
      var card = el('div', 'card');
      rows.forEach(function (r) {
        var row = el('div', 'row');
        var tx = el('span', 'tx');
        var a = el('a', 'lnk', r.title || r.host);
        if (/^https?:\/\//i.test(r.url)) a.href = r.url;
        a.onclick = function (ev) { ev.preventDefault(); openLink(r.url); };
        add(tx, a,
          el('div', 'mu', 'сейчас ' + (r.last_price == null ? '—' : zl(r.last_price) + ' zł') +
            ' · цель ' + zl(r.target) + ' zł' + (r.last_checked ? ' · проверено ' + dmt(r.last_checked) : '')),
          el('div', r.status === 'reached' ? 'mu acc' : 'mu', WISH_STATUS[r.status] || r.status));
        var x = el('button', 'btn ghost x', '❌');
        x.type = 'button';
        x.onclick = function () {
          if (armed !== x) {
            disarm();
            armed = x;
            text(x, 'Точно?');
            x.className = 'btn warn x';
            armTimer = setTimeout(disarm, 3000);
            return;
          }
          disarm();
          api('telegram-webhook', { action: 'wish_remove', id: r.id }).then(function () {
            toast('Убрал');
            load();
          }, function (e) { if (e.code === 'no such item') load(); });
        };
        card.appendChild(add(row, tx, x));
      });
      body.appendChild(card);
    }
    function load() {
      api('telegram-webhook', { action: 'wish' }).then(function (j) {
        rows = j.rows || [];
        render();
      }, noop);
    }
    load();
  }

  // --- news feed ---
  var STREAMS = [['all', 'все'], ['city', 'Варшава'], ['transport', 'транспорт'], ['legal', 'легализация']];
  var SOURCES = {
    'infor-legal': 'infor.pl', udsc: 'UdSC', muw: 'MUW', warszawa: 'warszawa.pl', wtp: 'WTP', ukrinform: 'Ukrinform'
  };
  function feedView() {
    var stream = store('stream');
    if (!/^(all|city|transport|legal)$/.test(stream)) stream = 'all';
    var seg = el('div', 'tabs seg fit'), body = el('div'), segs = {}, med = el('div');
    STREAMS.forEach(function (s) {
      var b = segs[s[0]] = el('button', '', s[1]);
      b.type = 'button';
      b.onclick = function () { stream = s[0]; store('stream', stream); load(); };
      seg.appendChild(b);
    });
    add(main, med, seg, body);

    // «🩺 Медицина»: current promotions from the med function's table, worded
    // as /med words them; hidden when there are none.
    function money(v) { var n = Number(v); return Number.isInteger(n) ? String(n) : zl(n); }
    api('miniapp', { action: 'med' }, undefined, true).then(function (j) {
      var rows = (j.rows || []).slice(0, 8);
      if (current !== 'feed' || !rows.length) return;
      var card = add(el('div', 'card'), el('h3', '', '🩺 Медицина'));
      rows.forEach(function (r) {
        var a = el('a', 'lnk', r.title);
        if (/^https?:\/\//i.test(r.url)) a.href = r.url;
        a.onclick = function (ev) { ev.preventDefault(); openLink(r.url); };
        var dt = r.discount_text ? String(r.discount_text).replace(/^-/, '−') : '';
        var deal = dt ? dt + (r.code ? ' по коду ' + r.code : '') : r.code ? 'по коду ' + r.code : '';
        var rest = (r.price != null ? ' — ' + money(r.price) + ' zł' : '') + (deal ? ' · ' + deal : '') +
          (r.valid_to ? ' · до ' + dm(r.valid_to) : '');
        var row = el('div', 'row');
        row.style.cursor = 'default';
        card.appendChild(add(row, add(el('span', 'tx'), document.createTextNode(r.provider + ' · '), a,
          document.createTextNode(rest))));
      });
      med.appendChild(card);
    }, noop);

    function render(rows) {
      clear(body);
      if (!rows.length) return add(body, el('p', 'empty', 'Новостей пока нет'));
      var card = el('div', 'card');
      rows.forEach(function (r) {
        var p = r.published_at ? wp(r.published_at) : null;
        var row = el('div', 'row'), tx = el('span', 'tx');
        add(tx, el('b', '', r.title), r.summary ? el('div', 'mu clip', r.summary) : null,
          el('div', 'mu', (SOURCES[r.source] || r.source) + ' · ' + (p ? p.day + '.' + p.month : '—')));
        if (/^https?:\/\//i.test(r.url)) row.onclick = function () { openLink(r.url); };
        else row.style.cursor = 'default';
        card.appendChild(add(row, tx));
      });
      body.appendChild(card);
    }
    function load() {
      for (var k in segs) segs[k].className = k === stream ? 'on' : '';
      var mine = stream;
      api('miniapp', { action: 'news', stream: stream }).then(function (j) {
        if (current === 'feed' && mine === stream) render(j.rows || []);
      }, noop);
    }
    load();
  }

  // --- changelog ---
  // changelog.json is published next to the page; the publish script stamps
  // the page's own date into <meta name="published">.
  function newsView() {
    var body = el('div'), meta = document.querySelector('meta[name="published"]');
    add(main, body, el('p', 'mu', 'страница: ' + ((meta && meta.content) || 'не опубликована')));
    fetch('./changelog.json', { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    }).then(function (list) {
      if (current !== 'news') return;
      list.forEach(function (e) {
        var ul = el('ul');
        e.lines.forEach(function (l) { ul.appendChild(el('li', '', l)); });
        body.appendChild(add(el('div', 'card'), el('h3', '', dm(e.date) + '.' + e.date.slice(0, 4) + ' · ' + e.title), ul));
      });
    }).catch(function () {
      if (current === 'news') add(clear(body), el('p', 'empty', 'Список обновлений недоступен'));
    });
  }

  var VIEWS = {
    home: homeView, list: listView, picks: picksView, prices: pricesView, stats: statsView, wish: wishView,
    feed: feedView, news: newsView
  };
  if (browser && !login) loginCard();
  else start();
})();
</script>
</body>
</html>
