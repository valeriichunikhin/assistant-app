})();

#ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 52px);z-index:2;display:grid;place-items:center;width:36px;height:36px;margin-left:-18px;border:1px solid var(--card-line);border-radius:50%;background:var(--surface);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:var(--shadow);color:var(--fg);opacity:0;transform:translateY(-48px);pointer-events:none;will-change:transform,opacity;transition:transform .6s var(--ease),opacity .4s ease,background .25s,color .25s,box-shadow .3s}

  .tabbar,.sheet,.scrim,.hdr .date,.hdr .out{display:none}
  .hdr{min-height:56px;padding:0 32px}
  .main{max-width:1264px;padding:24px 32px 48px}
  .main.narrow{max-width:784px}
  .row{min-height:40px;padding:8px 14px}
  .btn{min-height:36px;min-width:36px}
  .pg,.row.film .pg,.row.dela .pg{min-height:32px}
  .field{min-height:36px}
  .field input{height:34px}
  .seg{width:max-content;max-width:100%}
  .seg button{flex:none;min-height:30px;padding:0 12px}
  .seg.fit{width:auto}
  /* «Покупки»: the segment switch keeps to its words on a wide screen instead of spanning the lane (21.10.2026). */
  .seg.fit.shopseg{width:max-content}.seg.fit.shopseg button{flex:none;padding:0 24px}
  .seg.fit button{flex:1 0 auto}
  .chips .pill,.chips select{height:32px}
  /* Cards pack like a masonry, up to three columns of at least 380 px (20.10.2026). CSS columns drew a staircase in
     Safari: WebKit misplaces the cards' blur layers (backdrop-filter) inside a column box. Now a grid of 1 px rows;
     packing in the script gives every child a row span of its height plus the 16 px gap, and the grid's auto-placement
     puts each next card at the top of the shortest column, in reading order. */
  .cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(max(380px,calc((100% - 32px)/3)),1fr));grid-auto-rows:1px;column-gap:16px;align-items:start;margin-bottom:16px}
  .cols>*{min-width:0;margin:0}
  .cols>.state{grid-column:1/-1}
  /* «Фильмы»: an empty list holder takes no slot in the packing; search results in columns of rows (20.10.2026). */
  .flists>:empty{display:none}
  .flists>div>.card{margin:0}
  .fres{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr))}
  .fres>.fi{border-top:0;border-bottom:1px solid var(--line);margin-bottom:-1px}
  /* «LinkedIn»: drafts and ideas up to 1100 px, the plan and the posted beside them. */
  .lig{display:grid;grid-template-columns:minmax(0,1100px) minmax(360px,1fr);column-gap:16px;align-items:start}
  .lig>*{min-width:0}
  #toast{bottom:24px}
  /* «Что нового», settings cards: rows of ~36 px and a small checkbox-like switch (21.10.2026). */
  .set .row{min-height:36px;padding:3px 12px;gap:10px}
  .set .row .btn.x{min-height:30px;min-width:30px;padding:0;background:none;box-shadow:none}
  .set .row .btn.x:focus-visible{outline-offset:-2px}
  .set .row .mk{width:20px;height:20px}
  .set .sub{padding-top:2px;padding-bottom:6px}
}
/* Big monitors (19.10.2026, «сделай респонсивным»: on 2560 px the content sat in the middle third): the content
   widens with the screen — four card columns from 1800 px, five from 2300 px, wider one-column views. */
@media (min-width:1800px){.main{max-width:1760px}.main.narrow{max-width:960px}.cols{grid-template-columns:repeat(auto-fill,minmax(max(380px,calc((100% - 48px)/4)),1fr))}}
@media (min-width:2300px){.main{max-width:2200px}.main.narrow{max-width:1040px}.cols{grid-template-columns:repeat(auto-fill,minmax(max(380px,calc((100% - 64px)/5)),1fr))}}
/* «Задачи» on a wide screen (21.10.2026, «чтобы все столбцы помещались на один экран»): the groups as a board in the
   chain Просрочено → Сегодня → Скоро → Позже → Без срока → Сделано, empty ones too, read left to right (the masonry of
   .cols put «Без срока» under «Просрочено»). Three columns in two rows up to 1800 px; from there all six in one row over
   the full window width, each column scrolling inside and ending at the window's bottom (--tb-top: the board's distance
   from the page top, set by the view). «Сделано» is folded most of the time, so it is the narrower column; a row opens by
   a tap on it, so the one-row board drops its chevron. */
.tboard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start;margin-bottom:16px}
.tboard>.card{margin:0}
.tbl>.fi:first-child{border-top:1px solid var(--line)}
.tboard .none{padding:4px 14px 12px;color:var(--muted)}
@media (min-width:1800px){
  .tboard{grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,.8fr);margin:0}
  .main:has(>.tboard){max-width:none;padding-bottom:16px}
  .tboard>.card{display:flex;flex-direction:column;max-height:calc(100dvh - var(--tb-top,160px) - 16px)}
  .tboard>.card>.ch{flex:none}
  .tboard .tbl{overflow-y:auto;min-height:0;overscroll-behavior:contain}
  .tboard .fi>.row>.go{display:none}
}

.hrl{font-size:13px;color:var(--muted);white-space:nowrap}
.card.hcard{background:linear-gradient(100deg,color-mix(in srgb,var(--ring-load) var(--hl-tint),transparent),transparent 50%,color-mix(in srgb,var(--ring-sleep) var(--hl-tint),transparent)),var(--surface)}

.bw .hrings{flex:1;align-items:center;margin-top:4px}.bw .hrl{font-size:11px}.bw .hrc{gap:4px}
.hxs{margin:0 0 14px;padding:12px 0 0;border-top:1px solid var(--line)}.hxs:first-child{border-top:0;padding-top:0}
.hxh{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 4px}.hxh .pr{font:800 17px/1.2 var(--font-num);font-variant-numeric:tabular-nums}
.row.hxr{padding-left:0;padding-right:0;min-height:44px}.row.hxr .pr{white-space:nowrap;font-size:13px;font-variant-numeric:tabular-nums}
.hmon{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 14px 14px}
@media (min-width:900px){.hmon{grid-template-columns:repeat(3,minmax(0,1fr))}}
.hmt{--st:var(--muted);display:flex;gap:10px;align-items:center;min-width:0;padding:10px 12px 10px 8px;border-radius:var(--r-b);background:var(--surface-2)}
.hmt.hs-norm{--st:var(--ring-recovery)}.hmt.hs-above{--st:var(--hl-sky)}.hmt.hs-below{--st:var(--ring-load)}
.hmx{display:flex;flex-direction:column;gap:4px;min-width:0}.hml{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hmv{font:800 22px/1.1 var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.02em}.hmv small{font:500 12px var(--font);color:var(--muted);letter-spacing:0}
.hmt .pill{align-self:flex-start;height:20px;padding:0 8px;font-size:11px}.hmn{font-size:11px}

.htrk{flex:none;overflow:visible}.htrk .tr{fill:var(--track)}.htrk .band{fill:color-mix(in srgb,var(--st) 55%,transparent)}
.htrk .halo{fill:color-mix(in srgb,var(--st) 28%,transparent)}.htrk .dot{fill:var(--st);stroke:var(--solid);stroke-width:2}
.card.hfit{background:linear-gradient(180deg,color-mix(in srgb,var(--hl-peach) var(--hl-tint2),transparent),transparent 120px),var(--surface)}
.card.hbio{background:linear-gradient(180deg,color-mix(in srgb,var(--hl-teal) var(--hl-tint2),transparent),transparent 120px),var(--surface)}
.hwk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;padding:2px 14px 14px}

.hwc.wo{background:color-mix(in srgb,var(--ring-load) 16%,transparent);color:var(--ring-load)}
.hwd.on .hwc{box-shadow:0 0 0 2px var(--ring-load),0 0 12px color-mix(in srgb,var(--ring-load) 40%,transparent)}
.hgs{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 14px 14px}

.hgv{display:block;width:100%;max-width:168px;height:auto;overflow:visible}.hgv .tr,.hgv .zone{fill:none;stroke-linecap:round}

.hgv .ptr{stroke:var(--fg);stroke-width:3;stroke-linecap:round}.hgv .ptr.pth{stroke:var(--solid);stroke-width:7}

.hfd{flex:none;display:flex;gap:4px}.hfd i{width:7px;height:7px;border-radius:50%;background:var(--track)}
.row.hbr{gap:12px}.row.hbr .tx{flex:1;min-width:0}.row.hbr .tx .mu{font-size:12px}.hbv{font:800 19px/1.2 var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}

<script>
(function () {

  }
  function clear(e) { while (e.firstChild) e.removeChild(e.firstChild); return e; }

  var tg = window.Telegram && window.Telegram.WebApp;
  // Outside Telegram the page is a site: the Telegram Login Widget signs the
  // requests instead of initData, and its object is kept for 7 days, as long
  // as the functions accept it.
  var browser = !tg || !tg.initData;
  var login = null;
  // The Home Screen app signs with the device key instead (docs/specs/pwa-push.md): the bot's «Ссылка для
  // телефона» opens the page with ?key=…, kept in localStorage and taken out of the address bar.
  var appKey = null;
  var root = document.documentElement;
  // Inside Telegram the theme follows the app: data-theme from colorScheme, and
  // the gradient's top colour (--bg0) under Telegram's header. A browser follows the system.
  function theme() {

    var bg = getComputedStyle(root).getPropertyValue('--bg0').trim();

  // The price history: a faint grid with its prices, the 90-day minimum

  function chart(rows, minLine, W) {

      add(box, svg('line', { x1: L, x2: W - R, y1: y(v), y2: y(v), 'class': i === 2 ? 'ax' : 'grid' }),
        svg('text', { x: L - 6, y: y(v) + 4, 'class': 'tk', 'text-anchor': 'end' }, zl(v)));
    });
    if (minLine != null) {
      add(box, svg('line', { x1: L, x2: W - R, y1: y(minLine), y2: y(minLine), 'class': 'minl' }));

    var n = rows.length - 1;
    rows.forEach(function (r, i) {
      add(box, svg('circle', { cx: x(ts[i]), cy: y(ps[i]), r: i === n ? 5 : 3.5,
        'class': (SRC_CLASS[r.source] || 's-rc') + (i === n ? ' last' : '') }));

      'text-anchor': lx > W - R - 30 ? 'end' : 'middle' }, zl(ps[n])));

  // Weekly spend as bars: the current week outlined, every few weeks dated,

  function weekChart(weeks, now, W) {

    var H = 150, L = 4, T = 18, B = 20, n = weeks.length || 1;
    var box = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'class': 'chart', 'aria-label': 'Траты по неделям' });
    var max = Math.max.apply(null, weeks.map(function (w) { return w.spent; }).concat([0]));

  // --- genshin ---

  function genshinView() {

      'крио': 'cryo', cryo: 'cryo', ice: 'cryo', 'гео': 'geo', geo: 'geo', rock: 'geo' };
    function elementKey(x) { return ELEM[String(x || '').trim().toLowerCase()] || ''; }
    // Tints a character's card with its element; no known element, no change.
    function tint(node, x) {

      if (k) node.classList.add('elc', 'e-' + k);
      return node;
    }
    // A HoYoLAB icon in a circle (cls: s48, s28, s24; none is 36 px) or, without a usable one, the name's first letter.
    function ava(u, name, cls) {
      var ph = el('span', 'av' + (cls ? ' ' + cls : ''), String(name || '?').charAt(0).toUpperCase());
      ph.setAttribute('aria-hidden', 'true');

    function head(s) {

        p.abyss && !a ? 'Бездна ' + p.abyss : ''].filter(Boolean).join(' · ');
      var c = card('game', line || 'Genshin', []);
      if (imgOk(String(p.avatar || ''))) c.firstChild.firstChild.replaceWith(ava(p.avatar, p.nickname, 's40'));

    }
    // An accent meter of current/max; a warning from 160, when it is close to running over.
    function resin(r) {
      var full = r.current >= r.max || Date.parse(r.resin_full_at) <= Date.now();
      var m = Math.round((Date.parse(r.resin_full_at) - Date.now()) / 60000), h = Math.floor(m / 60);
      var left = m > 0 ? ' · через ' + [h ? h + ' ч' : '', m % 60 ? m % 60 + ' мин' : ''].filter(Boolean).join(' ') : '';
      var row = hrow(r.current >= 160 ? ict('triangle-alert', r.current + '/' + r.max) : r.current + '/' + r.max,
        full ? 'полная' : r.resin_full_at ? 'полная в ' + at(r.resin_full_at) + left : null);
      var bar = el('div', 'meter'), f = el('i');
      f.style.width = (r.max > 0 ? Math.min(100, r.current / r.max * 100) : 0) + '%';

    }
    // «Процветание (Кэ Цин), Борьба (Джинн)» from the Mac: a series a line, bold, its characters grey after a dash;
    // on Sunday everything is open.
    function series(s, what, sun) {
      var tx = add(el('span', 'tx'), el('div', 'mu', what + (sun ? ' · открыто всё' : ' сегодня'))), m, any = false;
      var re = /([^,()]+?)\s*\(([^)]*)\)/g;

    }
    function today(n, t) {
      var rows = [], c = n.commissions, ex = n.expeditions || [], d = n.discounts;
      if (c) rows.push(hrow('Поручения', c.claimed ? 'награда получена' : null, c.done + '/' + c.total));
      if (ex.length) {
        var next = ex.filter(function (e) { return !e.done && e.finish_at; })
          .sort(function (x, y) { return Date.parse(x.finish_at) - Date.parse(y.finish_at); })[0];
        rows.push(hrow('Экспедиции', next ? 'следующая в ' + at(next.finish_at) : 'все вернулись',
          ex.filter(function (e) { return e.done; }).length + '/' + ex.length));
      }
      if (n.transformer_ready) rows.push(hrow('Преобразователь', null, pill('готов', 'acc')));
      else if (n.transformer_at) rows.push(hrow('Преобразователь', 'готов в ' + at(n.transformer_at)));
      if (d) {

      }

    var GROUPS = [['series', 'Книги'], ['exp', 'Опыт'], ['other', 'Прочее'], ['mora', 'Мора']];
    // An ascension's level step and the AR it needs: «После AR 35» for 70.
    var CAP_AR = { 40: 15, 50: 25, 60: 30, 70: 35, 80: 40, 90: 50 };
    function talents(t) { return Array.isArray(t) ? t.join('/') : t == null ? '?' : String(t); }
    // «Процветание ×12 — пн, чт, вс»: a book's days as the Mac names them (its two weekdays and Sunday).
    function mat(m) {
      return m.name + ' ×' + grouped(m.amount) + (Array.isArray(m.days) && m.days.length ? ' — ' + m.days.join(', ') : '');
    }
    // Per character a heading row, then a row per group. Materials come as a
    // list (each with its group, none: «Прочее») or as {group: [..]}.
    function planHead(p) {
      var f = p.from || {}, t = p.to || {};
      return hrow(p.character, 'ур. ' + f.level + ' → ' + t.level + ' · таланты ' + talents(f.talents) +
        ' → ' + talents(t.talents));
    }
    // headless: the groups only, under a folded character row.
    function planRows(list, headless) {
      var rows = [];
      list.forEach(function (p) {
        var ms = p.materials || [], by = ms;
        if (!headless) rows.push(planHead(p));
        if (Array.isArray(ms)) {
          by = {};
          ms.forEach(function (m) {
            var k = m.group || 'other';
            (by[k] = by[k] || []).push(m);
          });
        }
        GROUPS.forEach(function (g) {
          var l = by[g[0]] || [];
          if (!l.length) return;
          var r = g[0] === 'mora'
            ? hrow(g[1], null, grouped(l.reduce(function (n, m) { return n + (Number(m.amount) || 0); }, 0)))
            : hrow(g[1], l.map(mat).join(' · '));

    // up to the current level cap (the first open), the next step folded under
    // «После AR N». No plan, no card.
    function plan(pl) {
      var now = (pl && pl.now) || [], next = (pl && pl.next) || [], one = {};
      if (!now.length && !next.length) return;
      var rows = now.map(function (p) { return folding(planHead(p), function () { return det(planRows([p], true)); }, one); });
      if (next.length) {
        var lv = next[0].to && next[0].to.level;

          function () { return det(planRows(next)); }));

    // The working codes, up to 8: the code in monospace, its rewards and date and a copy
    // button that reads «скопировано» for 1.5 s.
    function codes(list) {
      if (!list.length) return;
      card('ticket', 'Коды', list.slice(0, 8).map(function (c) {
        var sub = [c.rewards || '', c.published > 0 ? ddmm(c.published * 1000) : ''].filter(Boolean).join(' · ');
        var b = label(el('button', 'pg'), 'copy', 'Скопировать'), d = label(el('button', 'pg'), 'check', 'Активировал'),
          r = hrow(c.code, sub || null, add(el('span', 'acts'), b, d));
        b.type = 'button';
        d.type = 'button';
        // «Активировал»: the server stops offering the code; «Вернуть» deletes the mark.
        d.onclick = function () {
