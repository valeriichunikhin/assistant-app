<script>
// telegram-web-app.js only inside Telegram: its launch params in the address (tgWebAppData…), the copy the SDK keeps
// for a reload, or the client's webview bridge. Written in place, so it still runs before the app's code reads it;
// a browser tab or the Home Screen app never loads it.
(function () {
  var kept = '';
  try { kept = sessionStorage.getItem('__telegram__initParams') || ''; } catch (e) {}
  if (/tgWebApp/.test(location.hash + location.search + kept) || window.TelegramWebviewProxy) {
    document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');
  }
})();
</script>

/* Design: Valerii's pair of 17.10.2026 on the Geist structure (docs/specs/miniapp-geist.md): dark «21» and light
   «22», glass cards (blurred, translucent) on a violet gradient, Manrope, rows split by 1 px hairlines edge to
   edge, hover on everything interactive. The violet accent on primary buttons, the brand mark, the current tab,
   .pill.acc, stars, meters and chart bars. Telegram: data-theme from tg.colorScheme, its header the gradient's
   top; a browser follows prefers-color-scheme. Phone: header, bottom bar, «Ещё»
   sheet; from 900 px a rail (date, «выйти» at its foot), content to 1200 px, .main.narrow 720 px. */
:root{color-scheme:dark;
  --bg0:#0b0d14;--grad:linear-gradient(160deg,#0b0d14 0%,#1a1440 100%);--glass:rgba(11,13,20,.7);--solid:#1d1b33;
  --surface:rgba(255,255,255,.06);--surface-2:rgba(255,255,255,.07);--card-line:rgba(255,255,255,.1);--line:rgba(255,255,255,.1);
  --line-2:rgba(255,255,255,.18);--track:rgba(255,255,255,.12);--press:rgba(255,255,255,.06);
  --fg:#fff;--muted:#9aa0b4;--muted-2:#8c92a8;--accent:#7656ff;--accent-ink:#fff;--mark:#8b6cff;--link:#a891ff;
  --accent-soft:rgba(139,108,255,.16);--good:#3ecf8e;--good-bg:rgba(62,207,142,.12);--warn:#f5a623;
  --warn-bg:rgba(245,166,35,.12);--bad:#ff6166;--bad-bg:rgba(255,97,102,.12);--blue:#52a8ff;
  --el-pyro:#ef7938;--el-hydro:#4cc2f1;--el-anemo:#74c2a8;--el-electro:#af8ec1;--el-dendro:#a5c83b;--el-cryo:#9fd6e3;--el-geo:#fab632;
  --area-fba:#ff9999;--area-clinic:#5cc8ff;--area-personal:#5fdc8c;--area-home:#ffc24a;
  --toast:#1d1b33;--toast-act:var(--link);--toast-fg:#fff;--scrim:rgba(0,0,0,.6);--shadow:0 8px 24px rgba(0,0,0,.35);
  --r:20px;--r-b:14px;--r-s:10px;--bar:60px;--rail:240px;
  --font:"Manrope",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-num:var(--font)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light;
  --bg0:#eef0ff;--grad:linear-gradient(160deg,#eef0ff 0%,#fde7f3 100%);--glass:rgba(255,255,255,.6);--solid:#fff;

  --good:#0d7a4a;--good-bg:rgba(13,122,74,.1);--warn:#9a5a00;--warn-bg:rgba(200,128,0,.12);--bad:#c62828;

  --muted:#5b5f7a;--muted-2:#60647d;--accent:#6d4aff;--accent-ink:#fff;--mark:#6d4aff;--link:#5b36f2;--accent-soft:rgba(109,74,255,.12);

*{box-sizing:border-box}
html,body{margin:0;color:var(--fg)}
html{background:var(--bg0)}
/* The gradient on a fixed layer behind the page: iOS ignores background-attachment:fixed. */
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--grad);pointer-events:none}
body{font:14px/1.45 var(--font);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overflow-x:hidden}
button,input{font:inherit;color:inherit}
html{touch-action:pan-x pan-y}/* no pinch or double-tap zoom on the phone (Valerii, 18.10.2026) */
.field input{font-size:16px}/* under 16px iOS zooms in on focus */
button{cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* shell */
.col{min-width:0}
.hdr{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;min-height:52px;padding:env(safe-area-inset-top) 16px 0;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.hdr h1{flex:1;min-width:0;margin:0;font:800 20px/1.2 var(--font);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .date{color:var(--muted);font-size:13px;white-space:nowrap}
/* a refresh under way (docs/specs/app-cache-first.md): a 2px bar on the header's bottom edge, outside the flow */
.hdr.busy::after{content:"";position:absolute;left:0;bottom:-1px;width:30%;height:2px;background:var(--accent);animation:busy 1.1s ease-in-out infinite alternate}
@keyframes busy{to{transform:translateX(233.333%)}}
/* pull to refresh (docs/specs/pull-to-refresh.md): a 36 px circle that slides out from under the header with the
   touch; it exists only in a browser on a touch screen under 900 px. Inline transform and opacity while dragged. */
#ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 52px);z-index:2;display:grid;place-items:center;width:36px;height:36px;margin-left:-18px;border:1px solid var(--card-line);border-radius:50%;background:var(--surface);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:var(--shadow);color:var(--fg);opacity:0;transform:translateY(-48px);pointer-events:none;will-change:transform,opacity;transition:transform .6s cubic-bezier(.4,0,.2,1),opacity .4s ease,background .25s,color .25s,box-shadow .3s}
#ptr.drag{transition:background .15s,color .15s,box-shadow .2s}
#ptr .i{transition:transform .3s cubic-bezier(.4,0,.2,1)}
#ptr.drag .i{transition:none}
#ptr.ready{box-shadow:var(--shadow),0 0 0 4px var(--accent-soft)}
/* the page follows the finger a little and springs back (22.10.2026, «плавнее») */
.main.pull{transition:none;will-change:transform}
.main.pull-back{transition:transform .65s cubic-bezier(.4,0,.2,1)}
#ptr.ready,#ptr.spin{opacity:1;transform:translateY(24px);background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#ptr.ready .i{transform:rotate(180deg)}
#ptr.spin .i{animation:rotate .8s linear infinite}
@keyframes rotate{to{transform:rotate(360deg)}}
/* the Home Screen app only: iOS's own bounce would fight the gesture; a Safari tab keeps its native pull */
html.pwa,html.pwa body{overscroll-behavior-y:none}
.out{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r-b);background:none;color:var(--muted);font-size:13px;transition:background .12s}
.out .i{width:16px;height:16px}
.main{padding:12px 16px calc(var(--bar) + 28px + env(safe-area-inset-bottom))}
.main.in{animation:fade .5s cubic-bezier(.4,0,.2,1)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
/* gestures (docs/specs/gestures.md): a tab to the right comes in from the right, to the left from the left; a sideways
   swipe nudges the page before its segment switches */
.main.in-r{animation:in-r .6s cubic-bezier(.4,0,.2,1)}.main.in-l{animation:in-l .6s cubic-bezier(.4,0,.2,1)}
@keyframes in-r{from{transform:translateX(36px);opacity:0}}
@keyframes in-l{from{transform:translateX(-36px);opacity:0}}
.main.swipe-l,.main.swipe-r{opacity:.6;transition:transform .32s cubic-bezier(.4,0,.2,1),opacity .32s}.main.swipe-l{transform:translateX(-16px)}.main.swipe-r{transform:translateX(16px)}
/* A row's swipe (docs/specs/gestures-2.md): the row slides, the strip fills the gap it leaves, its mark at the near edge. */
.swh{position:relative;overflow:hidden}.row.swr{position:relative;z-index:1;will-change:transform}
.swp{position:absolute;overflow:hidden;color:var(--bg0);pointer-events:none}.swp.r{left:0;background:var(--good)}.swp.l{right:0;background:var(--bad)}
.swp .i{position:absolute;top:50%;margin-top:-10px}.swp.r .i{left:24px}.swp.l .i{right:24px}
.row.swb{transition:transform .55s cubic-bezier(.4,0,.2,1)}.swp.swb{transition:width .55s cubic-bezier(.4,0,.2,1)}
/* The bar steps away on a scroll down and comes back on the way up (gestures-2.md, 8). */
.tabbar{transition:transform .55s cubic-bezier(.4,0,.2,1)}.tabbar.hid{transform:translateY(calc(var(--vvy,0px) + 100% + env(safe-area-inset-bottom)))}
/* --vvy: the visual viewport's drift from the layout one, set only while iOS leaves one behind (gestures(), 10) */
.tabbar:not(.hid){transform:translateY(var(--vvy,0px))}body::before{transform:translateY(var(--vvy,0px))}
.rail{display:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;height:calc(var(--bar) + env(safe-area-inset-bottom));padding:0 4px env(safe-area-inset-bottom);background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tabbar button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;color:var(--muted);font:500 11px/1.1 var(--font)}
.tabbar .ic{display:grid;place-items:center;width:52px;height:30px;border-radius:15px;transition:background .12s}
.tabbar .lb{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabbar [aria-current]{color:var(--accent)}
.tabbar [aria-current] .ic{background:var(--accent-soft)}
.scrim{position:fixed;inset:0;z-index:6;background:var(--scrim);opacity:0;visibility:hidden;transition:opacity .4s,visibility 0s .4s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:7;padding:6px 12px calc(14px + env(safe-area-inset-bottom));background:var(--solid);border:1px solid var(--card-line);border-bottom:0;border-radius:var(--r) var(--r) 0 0;box-shadow:var(--shadow);transform:translateY(105%);visibility:hidden;transition:transform .5s cubic-bezier(.4,0,.2,1),visibility 0s .5s}
.more .scrim{opacity:1;visibility:visible;transition:opacity .4s}
.more .sheet{transform:none;visibility:visible;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.grab{width:36px;height:4px;margin:4px auto 10px;border-radius:2px;background:var(--line)}
.sheet button,.rail>button{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;padding:0 12px;border:0;border-radius:var(--r-b);background:none;color:var(--fg);font:500 15px/1.2 var(--font);text-align:left;transition:background .12s}
.sheet .ic,.rail .ic{display:grid;place-items:center;width:32px;height:32px;border:1px solid var(--line);border-radius:var(--r-s);color:var(--muted)}
.sheet [aria-current],.rail [aria-current]{background:var(--accent-soft);color:var(--link)}
.sheet [aria-current] .ic,.rail [aria-current] .ic{border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent)}
.brand{display:flex;align-items:center;gap:10px;height:40px;margin:0 0 12px;padding:0 8px;font:800 14px/1 var(--font);letter-spacing:-.02em}
.mark{display:grid;place-items:center;width:24px;height:24px;border-radius:var(--r-s);background:var(--accent);color:var(--accent-ink)}
.mark .i{width:16px;height:16px}
.rfoot{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);color:var(--muted-2);font-size:12px}
@media (hover:hover){.rail button:not([aria-current]):hover,.sheet button:not([aria-current]):hover,.row.tap:hover,.row:has(button):hover,.btn.ghost:hover,.out:hover{background:var(--press)}.tabbar button:not([aria-current]):hover .ic{background:var(--press)}
  .btn:not(.ghost):not(.warn):hover{filter:brightness(.94)}.pg:hover,button.pill:hover,.chips .pill:hover{border-color:var(--line-2);color:var(--fg)}.seg button:hover,.rail>button:not([aria-current]):hover{color:var(--fg)}}
/* blocks */
.card{background:var(--surface);border:1px solid var(--card-line);border-radius:var(--r);margin:0 0 16px;overflow:hidden;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:var(--shadow)}
.ch{display:flex;align-items:center;gap:10px;min-height:44px;padding:10px 14px 6px}
.ch:last-child{padding-bottom:10px}
/* The Genshin namecard: a faint picture under the card's own surface, fading out behind the text (20.10.2026: the
   card under a 72 % veil read as a pink block). */
.card.hero{position:relative;isolation:isolate}
.card.hero::before{content:'';position:absolute;inset:0;z-index:-1;background:var(--nc) center/cover;opacity:.16;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,transparent 10%,#000 70%);mask-image:linear-gradient(90deg,transparent 10%,#000 70%)}
.ch .ico{display:grid;place-items:center;flex:none;width:28px;height:28px;border:1px solid var(--line);border-radius:var(--r-s);color:var(--muted)}
.ch .ico .i{width:16px;height:16px}
.ch h3{flex:1;min-width:0;margin:0;font:800 14px/1.3 var(--font);letter-spacing:-.02em}
.card .sub{padding:0 14px 10px;color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:9px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.tap{cursor:pointer;transition:background .12s}
.row.tap:focus-visible{outline-offset:-2px}
.row.tap:active{background:var(--press)}
.row>.i.go{width:16px;height:16px;color:var(--muted-2)}
.row .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.row .t{font-weight:500}
.row b{font-weight:600}
.row .pr{flex:none;text-align:right;font:500 14px/1.3 var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .mech{display:block;color:var(--warn);font:400 12px var(--font)}
.row .old{display:block;color:var(--muted-2);text-decoration:line-through;font:400 12px var(--font-num);font-variant-numeric:tabular-nums}
.row .mk{width:22px;height:22px;color:var(--muted)}
.row .mk.on{color:var(--mark)}
.row.done .t{color:var(--muted);text-decoration:line-through}
.row.soon{background:color-mix(in srgb,var(--bad) 8%,transparent)}
.row.small{min-height:40px}
.lead{display:grid;place-items:center;flex:none;width:22px;color:var(--muted)}
.lead .i{width:18px;height:18px}
.mu{color:var(--muted);font-size:13px}
.clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 7px;border:1px solid var(--line);border-radius:999px;background:none;color:var(--muted);font:500 12px/1 var(--font);white-space:nowrap;vertical-align:1px}
.pill.good{color:var(--good)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}
.mnext.accent{color:var(--link)}.mnext.warn{color:var(--warn)}
.pill.good,.pill.warn,.pill.bad{border-color:color-mix(in srgb,currentColor 45%,transparent);background:color-mix(in srgb,currentColor 8%,transparent)}
.pill.acc{border-color:transparent;background:var(--accent-soft);color:var(--link)}
.t .pill,.mu .pill{margin-left:6px}
/* An icon inline before a label (ict): captions, pills, chips, buttons; .sx is one after the text (the Ukrainian version). */
.ii>.i{width:15px;height:15px;margin-right:5px;vertical-align:-3px}.pill .ii>.i{width:14px;height:14px;margin-right:4px}
.i.sx{width:14px;height:14px;margin-left:5px;vertical-align:-2px}#toast>.i{width:16px;height:16px;margin-right:6px;vertical-align:-3px}
.cmp span{white-space:nowrap}
.cmp .cw{font-weight:600;color:var(--link)}
.meter{height:6px;margin:6px 0 2px;border-radius:3px;background:var(--track);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:var(--mark)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:0 16px;border:0;border-radius:var(--r-b);background:var(--accent);color:var(--accent-ink);font:500 14px/1.1 var(--font);white-space:nowrap;transition:background .12s,filter .12s}
.btn .i{width:18px;height:18px}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5}
.btn.ghost{background:none;color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}

.btn.wide{width:100%}
.btn.x{flex:none;padding:0 10px}
.foot{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.foot .btn{flex:1 1 auto;min-width:0;padding:0 12px}
@media (max-width:399px){.foot .btn .i{display:none}}
.bar{display:flex;gap:8px;margin:0 0 12px}
.field{flex:1;min-width:0;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r-b);background:var(--surface-2);transition:border-color .12s,box-shadow .12s}
.field:focus-within{outline:2px solid var(--fg);outline-offset:2px}
.field .i{width:18px;height:18px;color:var(--muted)}
.field input{flex:1;min-width:0;height:42px;padding:0;border:0;background:none;outline:none;-webkit-appearance:none;appearance:none}
.field input::placeholder{color:var(--muted-2)}

.summary{display:flex;gap:18px;margin:2px 2px 16px;color:var(--muted);font-size:13px}
.summary b{color:var(--fg);font:500 14px var(--font-num);font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:1px;border-top:1px solid var(--line)}

.fst.mrh .i{width:14px;height:14px}
.mrev .row,.myear .row{padding-left:0;padding-right:0}.mrev .row .pr.neg{color:var(--bad)}.mrev .row .pr.pos{color:var(--good)}
.row.mprop{gap:8px}.row.mprop .tx{gap:2px}
.field.mpin{flex:none;width:112px;min-height:40px;padding:0 10px}.field.mpin input{width:100%;min-width:0;text-align:right;font-variant-numeric:tabular-nums}
.row.mprop .btn.x{flex:none;min-width:40px;height:40px;padding:0;justify-content:center}.row.mprop .btn.x .i{margin:0}
.mrtot{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px;padding:10px 0 0;border-top:1px solid var(--line);font-size:14px}
.mrtot b{font:600 15px/1.3 var(--font-num)}
.mrule{border-top:1px solid var(--line)}.mrule>.row{border-top:0}.mrule .chips.hs{margin:0 -16px;padding:0 16px 10px;flex-wrap:nowrap;overflow-x:auto}
.mrule .chips .pill .i{width:14px;height:14px;margin-right:6px}
.row.msub .mu .pill{margin-right:6px;vertical-align:1px}
.msoon{margin:0 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-s)}.msoon .msrc{font-size:14px;color:var(--fg)}.msoon .bar.mact{margin-top:8px}
.myear .msum{margin:0}.myear .minc{margin-bottom:6px}.myear .mcs{margin-top:10px}
.mcols{display:grid;grid-template-columns:minmax(0,1fr);gap:0 24px}
@media (min-width:900px){.tsum>div:has(>.myear){max-width:1040px}.mcols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media print{body.printing>*:not(.tsum),body.printing::before{display:none!important}body.printing .tsum{position:static;background:none}
  body.printing .tsum>div{max-height:none;overflow:visible;border:0;box-shadow:none;background:#fff;color:#000}
  body.printing .tsum .grab,body.printing .tsum .acts,body.printing .lsh,body.printing .tsum .lwk{display:none}
  body.printing .tsum .lprint{display:block}body.printing .tsum pre{color:#000;font:12pt/1.5 serif}}
/* «Уведомления» (docs/specs/notif-center.md): the header's bell with the unread count (phone: the tab's header; desktop:
   the top row next to the search), the feed by day with an accent bar on the unread rows, the entry a push opened ringed. */
.bell{position:relative;flex:none;display:grid;place-items:center;width:44px;height:44px;margin-right:-6px;border:0;border-radius:var(--r-b);background:none;color:var(--muted);transition:background .12s,color .12s}
.bell .i{width:20px;height:20px}
.bell[aria-current]{color:var(--accent);background:var(--accent-soft)}
.bell .bdg{position:absolute;top:3px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font:700 11px/18px var(--font-num);font-variant-numeric:tabular-nums;text-align:center;box-shadow:0 0 0 2px var(--bg0)}
.bell .bdg:empty{display:none}
@media (hover:hover){.bell:not([aria-current]):hover{background:var(--press);color:var(--fg)}}
/* A phone keeps the tab's name whole beside the bell: «выйти» is its icon only there (the word stays its name). */
@media (max-width:479px){.hdr .out{gap:0;padding:0 9px;font-size:0}}
@media (min-width:900px){.bell{width:36px;height:36px;margin:0}.bell .i{width:18px;height:18px}.bell .bdg{top:-4px;right:-6px}}
.ntop{display:flex;align-items:center;gap:8px;margin:0 0 12px}.ntop .hs{flex:1;min-width:0;padding:0;margin:0}
.ntop>.btn{flex:none}.ntop .pill .ii>.i{width:14px;height:14px}
.row.nt{align-items:flex-start}.row.nt .ptile{color:var(--muted)}.row.nt .mu{font-size:12px}
.row.nt .nb{margin-top:2px;white-space:pre-line;overflow-wrap:anywhere}
.row.nt>.pg{margin-top:-4px}
.row.nt.unr{box-shadow:inset 3px 0 0 var(--accent)}.row.nt.unr .ptile{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.row.nt.unr .t{font-weight:700}
.row.nt.hl{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
@media (min-width:900px){.row.nt>.pg{margin-top:0}}
/* «Уведомления»: the day header's check (reads that day) keeps the header's 44 px, the count sits before it. */
.ch>.pg{min-height:32px;padding:0 10px}.ch>.mu+.pg{margin-left:-2px}
</style>

<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
  var app = document.getElementById('app');
  function text(e, s) { e.textContent = s == null ? '' : String(s); return e; }
  function el(tag, cls, s) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (s != null && s.nodeType) e.appendChild(s);
    else if (s != null) text(e, s);
    return e;
  }
  function add(parent) {
    for (var i = 1; i < arguments.length; i++) if (arguments[i]) parent.appendChild(arguments[i]);
    return parent;
  }
  function clear(e) { while (e.firstChild) e.removeChild(e.firstChild); return e; }

  var tg = window.Telegram && window.Telegram.WebApp;
  // Outside Telegram the page is a site: the Telegram Login Widget signs the
  // requests instead of initData, and its object is kept for 7 days, as long
  // as the functions accept it.
  var browser = !tg || !tg.initData;
  var login = null;
  // The Home Screen app signs with the device key instead (docs/specs/pwa-push.md): the bot's «Ссылка для
  // телефона» opens the page with ?key=…, kept in localStorage and taken out of the address bar.
  var appKey = null;
  var root = document.documentElement;
  // Inside Telegram the theme follows the app: data-theme from colorScheme, and
  // the gradient's top colour (--bg0) under Telegram's header. A browser follows the system.
  function theme() {
    root.setAttribute('data-theme', tg.colorScheme === 'light' ? 'light' : 'dark');
    var bg = getComputedStyle(root).getPropertyValue('--bg0').trim();
    try { tg.setHeaderColor(bg); } catch (e) {}
    try { tg.setBackgroundColor(bg); } catch (e) {}
  }
  if (browser) {
    var query = new URLSearchParams(location.search);
    appKey = query.get('key') || store('appKey') || null;
    if (query.get('key')) {
      store('appKey', appKey);
      // Safari keeps ?key= so «На экран Домой» saves a URL that carries it: the installed app has its own storage and reads it on first launch.
      if (navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)) {
        query.delete('key');
        try { history.replaceState(null, '', location.pathname + (query.toString() ? '?' + query : '') + location.hash); } catch (e) {}
      }
    }
    try { login = JSON.parse(store('tgLogin') || 'null'); } catch (e) {}
    if (!login || !(Date.now() / 1000 - Number(login.auth_date) < 7 * 86400)) login = null;
  } else {
    try { tg.ready(); } catch (e) {}
    try { tg.expand(); } catch (e) {}
    theme();
    try { tg.onEvent('themeChanged', theme); } catch (e) {}
  }

  // The page is hosted off supabase.co, so the functions are named in full.
  var BASE = 'https://ssfkoyyhxqcmjokdxkpn.supabase.co/functions/v1/';
  var ERRORS = {
    closed: 'Уже закрыто', 'nothing selected': 'Ничего не отмечено', 'no such item': 'Уже убрано',
    'bad url': 'Нужна ссылка http(s) на товар', 'bad target': 'Цель — число больше нуля',
    'no such film': 'Нет такого фильма', 'no such event': 'Нет такого события', 'no such row': 'Уже закрыто', 'bad date': 'Дата — сегодня или позже',
    'no title': 'Нужен текст', too_close: 'Срок уже завтра — отложить некуда', late: 'Поздно, уже не вернуть'
  };

  var toastEl = document.getElementById('toast');
  var toastTimer;
  function toast(s, ic) {
    add(clear(toastEl), ic && s ? icon(ic) : null, document.createTextNode(s || 'Не получилось, попробуй ещё раз'));
    toastEl.className = 'on';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.className = ''; }, 3000);
  }
  // «Убрал · Вернуть» for 10 s: the button brings the ids back, then `after`.
  function undoToast(s, ids, after) {
    backToast(s, function () { api('telegram-webhook', { action: 'undo', ids: ids.join(',') }).then(after, noop); });
  }
  function backToast(s, fn) {
    var b = el('button', 'tl', 'Вернуть');
    b.type = 'button';
    b.onclick = function () {
      toastEl.className = '';
      fn();
    };
    add(clear(toastEl), document.createTextNode(s + ' · '), b);
    toastEl.className = 'on act';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.className = ''; }, 10000);
  }
  // The x-tg-login header: the login object's JSON as base64url (UTF-8).
  function b64url(s) {
    var bytes = new TextEncoder().encode(s), bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  // `body`, when given, goes as JSON.
  function api(fn, params, ms, quiet, body) {
    if (browser && !login && !appKey) return Promise.reject(new Error('login'));
    var opts = {
      method: 'POST',
      headers: !browser ? { 'x-tma-init-data': tg.initData }
        : appKey ? { 'x-app-key': appKey } : { 'x-tg-login': b64url(JSON.stringify(login)) }
    };
    if (body) {
      opts.body = JSON.stringify(body);
      opts.headers['content-type'] = 'application/json';
    }
    if (window.AbortSignal && AbortSignal.timeout) opts.signal = AbortSignal.timeout(ms || 15000);
    return fetch(BASE + fn + '?' + new URLSearchParams(params), opts)
      .then(function (r) {
        return r.json().catch(function () { return null; }).then(function (j) {
          // A 2xx without a JSON body is a failure too.
          if (!r.ok || !j || j.ok === false) {
            var err = new Error((j && j.error) || String(r.status));
            err.code = j && j.error;
            err.answer = j && j.answer;
            // An expired or refused login: back to the card, no toast.
            if (r.status === 401 && browser) {
              err.login = true;
              if (appKey) loginCard('Открой /app в боте и нажми «Ссылка для телефона»');
              else if (login) loginCard('Сессия истекла, войди снова');
            }
            throw err;
          }
          return j;
        });
      })
      .catch(function (e) {
        if (!e.login && !quiet) toast(ERRORS[e && e.code]);
        throw e;
      });
  }
  function haptic() {
    try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
  }
  function store(k, v) {
    try {
      if (v === undefined) return localStorage.getItem(k);
      localStorage.setItem(k, v);
    } catch (e) {}
    return null;
  }
  function zl(v) {
    return v == null || v === '' ? '—' : Number(v).toFixed(2).replace('.', ',');
  }
  function dm(d) { return d ? d.slice(8, 10) + '.' + d.slice(5, 7) : ''; }
  // A timestamp as dd.mm in the phone's own time zone.
  function dmt(ts) {
    var d = new Date(ts);
    return isNaN(d) ? '' : ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2);
  }
  function plain(html) {
    return String(html || '').replace(/<[^>]*>/g, '')
      .replace(/&#(x[0-9a-f]+|\d+);/gi, function (m, n) {
        var c = n[0] === 'x' || n[0] === 'X' ? parseInt(n.slice(1), 16) : +n;
        return c > 0 && c < 0x110000 ? String.fromCodePoint(c) : m;
      })
      .replace(/&quot;/g, '"').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
  }
  // A deal line («Żel do prania Coccolino, 1,48 l · <b>−50%</b> · 1+1 🪪») as a person reads it: the full name
  // (the label is cut at 21 letters) and a Russian note of the deal; the price stays in its own column.
  var DEAL_RU = [[/^drugi −(\d+)%$/i, 'второй −$1%'], [/^drugi za (.+)$/i, 'второй за $1'], [/^co druga −(\d+)%$/i, 'каждая вторая −$1%'],
    [/^przy (\d+) szt\.$/i, 'при покупке $1 шт.'], [/^1\+1$/, 'второй в подарок'], [/^2\+1$/, 'третий в подарок'],
    [/^supercena$/i, 'суперцена']];
  function dealParts(c) {
    var s = plain(c.line), star = /^⭐ /.test(s), warn;
    s = s.replace(/^⭐ /, '');
    warn = /^⚠️ не скидка · /.test(s);
    s = s.replace(/^⚠️ не скидка · /, '');
    var segs = s.split(' · '), name = segs.shift() || String(c.label || '').replace(/^⭐ /, '').replace(/^[−-]\d+% /, '');
    var note = [];
    segs.forEach(function (x) {
      var card = / 🪪$/.test(x);
      x = x.replace(/ 🪪$/, '').replace(/ 🪪/g, ' по карте').trim();
      if (/^\d[\d,]*( \d[\d,]*)?$/.test(x)) x = '';  // the price and the old price: the right column has them
      DEAL_RU.forEach(function (r) { x = x.replace(r[0], r[1]); });
      if (x) note.push(x);
      if (card) note.push('по карте');
    });
    return { name: name, note: note.join(' · '), star: star, warn: !!warn };
  }
  function noop() {}

  // --- building blocks ---
  // A Lucide icon from the sprite in the body.
  function icon(name, cls) {
    return add(svg('svg', { 'class': 'i' + (cls ? ' ' + cls : ''), 'aria-hidden': 'true' }), svg('use', { href: '#i-' + name }));
  }
  // An icon and a label inside a button; called again to relabel it.
  function label(b, ic, s) {
    add(clear(b), ic ? icon(ic) : null, document.createTextNode(s));
    return b;
  }
  // An icon inline before a text (.ii): a chip, a pill, a caption.
  function ict(ic, s) { return add(el('span', 'ii'), icon(ic), document.createTextNode(s)); }
  // A text with the Ukrainian version's mark after it (the cinemas); a plain string when there is none.
  function ua(s, on) { return on ? add(el('span'), document.createTextNode(s), icon('languages', 'sx')) : s; }
  // Parts (strings or nodes) into e, joined by « · »; empty ones left out.
  function dotted(e, parts) {
    parts.filter(Boolean).forEach(function (p, i) { add(e, i ? document.createTextNode(' · ') : null, p.nodeType ? p : document.createTextNode(p)); });
    return e;
  }
  function mkCard(ic, title, sub) {
    return add(el('div', 'card'), add(el('div', 'ch'), add(el('span', 'ico'), icon(ic)), el('h3', '', title)),
      sub ? el('div', 'sub', sub) : null);
  }
  function pill(s, kind) { return el('span', 'pill' + (kind ? ' ' + kind : ''), s); }
  // The only <img> sources: TMDB posters, Cinema City's posters, the shops' product photos (Aldi's on scene7 and
  // an-pcm, Biedronka's image host), HoYoLAB icons and Enka's profile pictures (https, a host under hoyoverse.com or
  // hoyolab.com); besides them only the app's own files (brands/*.png of «Деньги», set by moneyLogo) and a picked
  // file's blob: in the receipt reader.
  function imgOk(u) {
    return /^https:\/\/image\.tmdb\.org\//.test(u) || /^https:\/\/enka\.network\/ui\//.test(u)
      || /^https:\/\/www\.cinema-city\.pl\/xmedia/.test(u)
      || /^https:\/\/(s7g10\.scene7\.com|prd\.an-pcm\.com|images\.biedronka\.cloud)\//.test(u)
      || /^https:\/\/([a-z0-9-]+\.)+(hoyoverse|hoyolab)\.com\//i.test(u);
  }
  // A small icon in front of a row.
  function lead(r, ic) { r.insertBefore(add(el('span', 'lead'), icon(ic)), r.firstChild); return r; }
  // A JS twin of CATS in scripts/deal_batch.py: the same ids and keyword lists,
  // the first match wins; edit both together. The emoji is the one in the
  // category's title in the bot.
  var CATS = [['pets', '🐾', ['karma', 'dla kota', 'dla psa', 'żwirek', 'whiskas', 'pedigree', 'felix', 'purina']],
    ['kids', '👶', ['pieluch', 'pampers', 'dla dzieci', 'dla niemowl', 'mleko modyfikowane', 'kaszka', 'chusteczki nawilżane']],
    ['alcohol', '🍺', ['piwo', 'wino', 'wódka', 'whisk', 'likier', 'prosecco', 'cydr', 'gin ', 'rum ']],
    ['household', '🧴', ['odplamiacz', 'nabłyszczacz', 'zmywark', 'vanish', 'worki na śmieci', 'płyn do', 'serwet', 'proszek', 'kapsułki do prania', 'papier toalet', 'ręcznik papier', 'worki', 'zmywak', 'domestos', 'cif', 'ariel', 'persil', 'lenor', 'vizir', 'coccolino', 'odświeżacz', 'gąbk', 'ściereczk']],
    ['cosmetics', '🧼', ['makijaż', 'pomadk', 'tusz do rzęs', 'mgiełk', 'lakier do włosów', 'odżywk', 'taft', 'schauma', 'balsam do ciała', 'serum', 'maseczk', 'szampon', 'żel pod prysznic', 'twarzy', 'micelarn', 'pasta do zęb', 'szczoteczk', 'dezodorant', 'antyperspirant', 'krem', 'maszynk', 'gillette', 'axe', 'nivea', 'dove', 'mydło', 'podpask', 'tampon', 'balsam', 'perfum', 'wod. toaletowa']],
    ['sweets', '🍫', ['orzech', 'migdał', 'pistacj', 'cookies', 'ciastk', 'chrupk', 'żurawin', 'rodzynk', 'bakalie', 'czekolad', 'pralin', 'ptasie', 'ciast', 'wafel', 'żelk', 'drażet', 'cukier', 'chips', 'rogal', 'toffi', 'merci', 'raffaello', 'ferrero', 'lindt', 'syrop', 'mus ', 'baton', 'orzeszk', 'paluszk', 'krakers']],
    ['dairy', '🥛', ['mleko', 'masło', 'ser', 'jogurt', 'śmietan', 'twaróg', 'twarog', 'jaj', 'kefir', 'maślank', 'deser']],
    ['meat', '🥩', ['mięso', 'mięsa', 'mięsn', 'kraina mięs', 'schab', 'łopatk', 'parówk', 'kiełbas', 'szynk', 'boczek', 'kurcz', 'indyk', 'ryb', 'łosoś', 'śledź', 'kabanos', 'wędlin', 'frankfurt', 'karkówk', 'wołow', 'filet']],
    ['produce', '🍅', ['pomidor', 'banan', 'winogron', 'malin', 'cytryn', 'jabł', 'ogór', 'papryk', 'pieczark', 'ziemniak', 'cebul', 'marchew', 'sałat', 'gruszk', 'śliwk', 'borów', 'awokado', 'mandarynk', 'pomarańcz', 'truskawk']],
    ['ready', '🍱', ['sajgonk', 'pierog', 'pizz', 'zapiekank', 'gotowe danie', 'mrożon', 'lody', 'frytki', 'pierogi', 'nuggets', 'gotow', 'zestaw obiadowy', 'sałatka', 'kebab', 'burger']],
    ['bakery', '🍞', ['bagiet', 'ketchup', 'majonez', 'musztard', 'mąka', 'olej rzepak', 'sos pomidor', 'kasza', 'płatki owsian', 'chleb', 'bułk', 'makaron', 'ryż', 'mąk', 'kasz', 'płatk', 'oliw', 'olej', 'sos', 'przypraw', 'konserw', 'sardynk', 'tuńczyk', 'kwas', 'musli', 'miód', 'dżem']],

    ['drinks', '🥤', ['cola', 'napój', 'sok', 'woda', 'energ', 'pepsi', 'sprite', 'fanta']],
    ['other', '🏠', []]];
  var CAT_EMO = {};
  CATS.forEach(function (c) { CAT_EMO[c[0]] = c[1]; });
  // Handwritten list items are mostly Russian: a second list for them, tried
  // after the Polish twin (not part of the twin; oils before dairy's «масл»).
  var RU_CATS = [['bakery', ['оливк', 'подсолн', 'растительн']],
    ['pets', ['корм', 'кошач', 'собач', 'наполнител']],
    ['kids', ['подгузн', 'детск', 'памперс']],

    // --- lists ---
    // No hint: the card shows only when it has films. fold: a header tap folds and unfolds it (kept in folded).
    function listCard(box, ic, title, rows, hint, sec, fold) {

    // --- stats (docs/specs/films-stats.md) ---
    // Folded by default (localStorage filmStatsOpen); an unfold loads films_stats through swr and draws it.
    function drawStats() {

  // --- genshin ---
  // The Mac's snapshot (genshin_state: HoYoLAB notes and characters, the Enka
  // profile, the morning line's rows) and the HoYoLAB events not over yet,
  // from miniapp ?action=genshin (docs/specs/genshin-tab.md); v2 adds the
  // builds, the farming plan, the Abyss, the codes and the event tips
  // (docs/specs/genshin-tab-v2.md).
  function genshinView() {
    var body = el('div', 'cols');
    add(main, body);
    // A moment in Warsaw: «HH:MM» today, «dd.mm HH:MM» on another day.
    function at(ts) {
      var p = wp(ts), t = wp(Date.now());
      return (p.day === t.day && p.month === t.month ? '' : p.day + '.' + p.month + ' ') + p.hour + ':' + p.minute;
    }
    // «dd.mm» of a date or a moment; '' when it does not parse.
    function ddmm(ts) {
      if (isNaN(new Date(ts).getTime())) return '';

    }
    function card(ic, title, rows) {
      var c = mkCard(ic, title);
      rows.forEach(function (r) { c.appendChild(r); });

    }
    // A block of rows under an unfolded row.
    function det(rows) { return add.apply(null, [el('div', 'det')].concat(rows)); }
    // The element's class of a character (Russian name or code in any case: Пиро, pyro, Fire …); '' when unknown.
    var ELEM = { 'пиро': 'pyro', pyro: 'pyro', fire: 'pyro', 'гидро': 'hydro', hydro: 'hydro', water: 'hydro', 'анемо': 'anemo', anemo: 'anemo',
      wind: 'anemo', 'электро': 'electro', electro: 'electro', electric: 'electro', 'дендро': 'dendro', dendro: 'dendro', grass: 'dendro',
      'крио': 'cryo', cryo: 'cryo', ice: 'cryo', 'гео': 'geo', geo: 'geo', rock: 'geo' };
    function elementKey(x) { return ELEM[String(x || '').trim().toLowerCase()] || ''; }
    // Tints a character's card with its element; no known element, no change.
    function tint(node, x) {
      var k = elementKey(x);
      if (k) node.classList.add('elc', 'e-' + k);
      return node;
    }
    // A HoYoLAB icon in a circle (cls: s48, s28, s24; none is 36 px) or, without a usable one, the name's first letter.
    function ava(u, name, cls) {
      var ph = el('span', 'av' + (cls ? ' ' + cls : ''), String(name || '?').charAt(0).toUpperCase());
      ph.setAttribute('aria-hidden', 'true');
      if (!imgOk(String(u || ''))) return ph;
      var img = el('img', ph.className);
      img.alt = '';
      img.loading = 'lazy';
      img.referrerPolicy = 'no-referrer';
      img.src = u;
      img.onerror = function () { img.replaceWith(ph); };
      return img;
    }
    // A row with a chevron that shows make()'s block under itself on a tap and
    // hides it on the next; rows sharing `one` keep one open at a time.
    function folding(r, make, one) {
      var shown = null;
      function shut() {
        shown.remove();
        shown = null;
        r.classList.remove('open');
        r.setAttribute('aria-expanded', 'false');
      }
      r.appendChild(icon('chevron-down', 'go'));
      r.setAttribute('aria-expanded', 'false');
      return tap(r, function () {
        if (shown) {
          shut();
          if (one) one.shut = null;
          return;
        }
        if (one && one.shut) one.shut();
        shown = make();
        r.after(shown);
        r.classList.add('open');
        r.setAttribute('aria-expanded', 'true');
        if (one) one.shut = shut;
      });
    }
    function head(s) {
      var p = s.profile || {}, a = s.abyss;
      var line = [p.nickname, p.ar != null ? 'AR ' + p.ar : '', p.wl != null ? 'WL ' + p.wl : '',
        p.abyss && !a ? 'Бездна ' + p.abyss : ''].filter(Boolean).join(' · ');
      var c = card('game', line || 'Genshin', []);
      if (imgOk(String(p.avatar || ''))) c.firstChild.firstChild.replaceWith(ava(p.avatar, p.nickname, 's40'));
      if (imgOk(String(p.namecard || ''))) {
        c.classList.add('hero');
        c.style.setProperty('--nc', 'url("' + p.namecard + '")');
      }
      if (s.notes_at) c.firstChild.appendChild(el('span', 'mu', 'обновлено ' + at(s.notes_at)));
      // HoYoLAB's Abyss replaces Enka's floor: «Бездна 8-3 · [star] 24 · до 16.11».
      if (a && a.max_floor) {
        c.appendChild(dotted(el('div', 'sub'), ['Бездна ' + a.max_floor, a.stars != null ? ict('star', String(a.stars)) : '',
          ddmm(a.end_at) ? 'до ' + ddmm(a.end_at) : '']));
      }
    }
    // An accent meter of current/max; a warning from 160, when it is close to running over.
    function resin(r) {
      var full = r.current >= r.max || Date.parse(r.resin_full_at) <= Date.now();
      var m = Math.round((Date.parse(r.resin_full_at) - Date.now()) / 60000), h = Math.floor(m / 60);
      var left = m > 0 ? ' · через ' + [h ? h + ' ч' : '', m % 60 ? m % 60 + ' мин' : ''].filter(Boolean).join(' ') : '';
      var row = hrow(r.current >= 160 ? ict('triangle-alert', r.current + '/' + r.max) : r.current + '/' + r.max,
        full ? 'полная' : r.resin_full_at ? 'полная в ' + at(r.resin_full_at) + left : null);
      var bar = el('div', 'meter'), f = el('i');
      f.style.width = (r.max > 0 ? Math.min(100, r.current / r.max * 100) : 0) + '%';
      row.firstChild.insertBefore(add(bar, f), row.firstChild.lastChild);
      card('clock', 'Смола', [row]);
    }
    // «Процветание (Кэ Цин), Борьба (Джинн)» from the Mac: a series a line, bold, its characters grey after a dash;
    // on Sunday everything is open.
    function series(s, what, sun) {
      var tx = add(el('span', 'tx'), el('div', 'mu', what + (sun ? ' · открыто всё' : ' сегодня'))), m, any = false;
      var re = /([^,()]+?)\s*\(([^)]*)\)/g;
      while ((m = re.exec(s))) {
        any = true;
        tx.appendChild(add(el('div'), el('b', '', m[1].trim()), el('span', 'mu', ' — ' + m[2])));
      }
      if (!any) tx.appendChild(el('div', 't', s));
      return add(el('div', 'row'), tx);
    }
    function today(n, t) {
      var rows = [], c = n.commissions, ex = n.expeditions || [], d = n.discounts;
      if (c) rows.push(hrow('Поручения', c.claimed ? 'награда получена' : null, c.done + '/' + c.total));
      if (ex.length) {
        var next = ex.filter(function (e) { return !e.done && e.finish_at; })
          .sort(function (x, y) { return Date.parse(x.finish_at) - Date.parse(y.finish_at); })[0];
        rows.push(hrow('Экспедиции', next ? 'следующая в ' + at(next.finish_at) : 'все вернулись',
          ex.filter(function (e) { return e.done; }).length + '/' + ex.length));
      }
      if (n.transformer_ready) rows.push(hrow('Преобразователь', null, pill('готов', 'acc')));
      else if (n.transformer_at) rows.push(hrow('Преобразователь', 'готов в ' + at(n.transformer_at)));
      if (d) {
        // Bold from Friday to Sunday: the discounts reset on Monday.
        var w = wp(Date.now()), k = d.left + '/' + d.max;
        rows.push(hrow('Скидки на боссов', null, wd(w.year + '-' + w.month + '-' + w.day) >= 4 ? el('b', '', k) : k));
      }
      var q = wp(Date.now());
      if (t.date === q.year + '-' + q.month + '-' + q.day) {
        var sun = wd(t.date) === 6;
        if (t.books) rows.push(series(t.books, 'Книги', sun));
        if (t.weapons) rows.push(series(t.weapons, 'Оружие', sun));

      if (rows.length) card('check-square', 'Сегодня', rows);
    }
    // The Mac's groups in this order; mora is one number on the right.
    var GROUPS = [['series', 'Книги'], ['exp', 'Опыт'], ['other', 'Прочее'], ['mora', 'Мора']];
    // An ascension's level step and the AR it needs: «После AR 35» for 70.
    var CAP_AR = { 40: 15, 50: 25, 60: 30, 70: 35, 80: 40, 90: 50 };
    function talents(t) { return Array.isArray(t) ? t.join('/') : t == null ? '?' : String(t); }
    // «Процветание ×12 — пн, чт, вс»: a book's days as the Mac names them (its two weekdays and Sunday).
    function mat(m) {
      return m.name + ' ×' + grouped(m.amount) + (Array.isArray(m.days) && m.days.length ? ' — ' + m.days.join(', ') : '');
    }
    // Per character a heading row, then a row per group. Materials come as a
    // list (each with its group, none: «Прочее») or as {group: [..]}.
    function planHead(p) {
      var f = p.from || {}, t = p.to || {};
      return hrow(p.character, 'ур. ' + f.level + ' → ' + t.level + ' · таланты ' + talents(f.talents) +
        ' → ' + talents(t.talents));
    }
    // headless: the groups only, under a folded character row.
    function planRows(list, headless) {
      var rows = [];
      list.forEach(function (p) {
        var ms = p.materials || [], by = ms;
        if (!headless) rows.push(planHead(p));
        if (Array.isArray(ms)) {
          by = {};
          ms.forEach(function (m) {
            var k = m.group || 'other';
            (by[k] = by[k] || []).push(m);
          });
        }
        GROUPS.forEach(function (g) {
          var l = by[g[0]] || [];
          if (!l.length) return;
          var r = g[0] === 'mora'
            ? hrow(g[1], null, grouped(l.reduce(function (n, m) { return n + (Number(m.amount) || 0); }, 0)))
            : hrow(g[1], l.map(mat).join(' · '));
          r.className += ' small';
          rows.push(r);
        });
      });
      return rows;
    }
    // «План фарма» after «Команда»: a folded row per character with the materials

  // --- changelog ---

  // --- notification center (docs/specs/notif-center.md) ---
  // Every push the functions send, kept 30 days whether the app rang or not: by day, newest first, a row per entry

  // topics of the rows loaded); a day's header reads that day (21.10.2026: «Прочитать всё» removed on his word, the
  // day's check is enough); «Открыть» goes where the push would have (its tab), marking the entry read. Opened from a push (#notif/<id>) the entry is ringed, scrolled to the middle and read.
  var NOTIF_ICONS = { Assistant: 'spark', Claude: 'inbox', 'Тревоги': 'triangle-alert' };
  function notifIcon(r) {
    var t = r.tab && tabOf(canon(r.tab)), m = modules.filter(function (x) { return x.name === r.title; })[0];
    return t ? t[1] : m && MODULE_ICONS[m.env] ? MODULE_ICONS[m.env] : NOTIF_ICONS[r.title] || 'bell';
  }
  function notifView() {
    // readLocal / readAll: what he marked here, so an answer that left before the mark does not bring it back.
    var focus = notifFocus, seen = false, topic = null, rows = [], more = false, extra = [], readLocal = {}, readAll = false;
    notifFocus = null;
    var top = el('div', 'ntop'), chips = el('div', 'hs'), body = el('div', wide() ? 'cols' : ''), foot = el('div');
    chips.setAttribute('role', 'group');
    chips.setAttribute('aria-label', 'Темы');
    add(main, add(top, chips), body, foot);
    function live() { return current === 'notif'; }
    function dayName(date, today) {
      return date === today ? 'Сегодня' : date === addDays(today, -1) ? 'Вчера' : WEEK[wd(date)] + ' ' + dm(date);
    }
    // Marks ids read on the server; the rows on screen and the count change at once, a failure only toasts.
    function read(ids) {
      var now = new Date().toISOString();
      if (ids) ids.forEach(function (id) { readLocal[id] = true; });
      else readAll = true;
      rows.concat(extra).forEach(function (r) { if (!r.read_at && (!ids || ids.indexOf(r.id) >= 0)) r.read_at = now; });
      if (!ids) setUnread(0);
      else setUnread(notifUnread - ids.length);
      cacheDrop('notif');
      return api('miniapp', { action: 'notif_read' }, 15000, true, ids ? { ids: ids } : { all: true })
        .then(function (j) { if (j && typeof j.unread === 'number') setUnread(j.unread); }, function (e) { if (!e.login) toast(); });
    }
    function row(r) {
      var p = wp(r.at), t = r.tab && isView(canon(r.tab)) && r.tab !== 'notif' ? r.tab : null;
      var tile = add(el('span', 'ptile'), icon(notifIcon(r)));
      tile.setAttribute('aria-hidden', 'true');
      var x = add(el('div', 'row nt' + (r.read_at ? '' : ' unr') + (r.id === focus ? ' hl' : '')), tile,
        add(el('span', 'tx'), el('div', 't', r.title || 'Assistant'), r.body ? el('div', 'nb', r.body) : null,
          el('div', 'mu num', p.hour + ':' + p.minute + (r.read_at ? '' : ' · новое'))));
      if (t) {
        var b = label(el('button', 'pg'), 'forward', 'Открыть');
        b.type = 'button';
        b.setAttribute('aria-label', 'Открыть: ' + (NAMES[t] || t));
        b.onclick = function () {
          haptic();
          if (!r.read_at) read([r.id]);
          show(t);

        x.appendChild(b);
      }
      x.nid = r.id;
      return x;
    }
    function draw() {
      if (!live()) return;
      var tw = wp(Date.now()), list = rows.concat(extra), today = tw.year + '-' + tw.month + '-' + tw.day, titles = [];
      // Opened from a push: the entry is read before it is drawn (the ring shows which one it was).
      var f = !seen && focus && list.filter(function (r) { return r.id === focus; })[0];
      if (f && !f.read_at) read([f.id]);

      if (topic && titles.indexOf(topic) < 0) topic = null;
      clear(chips);
      if (titles.length > 1) {
        chips.appendChild(chip('Все', !topic, null, function () { topic = null; draw(); }));
        titles.forEach(function (k) {
          var b = chip('', topic === k, k, function () { topic = topic === k ? null : k; draw(); });
          b.appendChild(ict(notifIcon(list.filter(function (r) { return (r.title || 'Assistant') === k; })[0]), k));
          chips.appendChild(b);
        });
      }
      top.style.display = chips.firstChild ? '' : 'none';
      clear(body);
      clear(foot);
      var shownRows = list.filter(function (r) { return !topic || (r.title || 'Assistant') === topic; });
      if (!shownRows.length) return add(body, state('bell', topic ? 'По этой теме пусто' : 'Уведомлений за 30 дней нет'));
      var cards = {}, hit = null, unread = {};
      shownRows.forEach(function (r) {

      Object.keys(cards).forEach(function (date) {

        foot.appendChild(m);

        seen = true;

    }
    function load() {
      swr({ key: 'notif', box: body, n: 3, live: live,
        fetch: function () { return api('miniapp', { action: 'notif_list' }, 15000, true, {}); },
        render: function (j) {
          var now = new Date().toISOString(), off = 0;
          rows = j.rows || [];
          rows.forEach(function (r) { if (!r.read_at && (readAll || readLocal[r.id])) { r.read_at = now; off++; } });
          if (!extra.length) more = !!j.more;
          if (typeof j.unread === 'number') setUnread(readAll ? 0 : j.unread - off);
          draw();
        }, retry: load });
    }
    load();
  }

    cinema: cinemaView, films: filmsView, dela: delaView, money: moneyView, tasks: tasksView, legal: legalView, li: liView, inbox: inboxView, feed: feedView, news: newsView, vb: vbView,
    genshin: genshinView, notif: notifView

  window.APP = {
    el: el, add: add, text: text, clear: clear, icon: icon, label: label, mkCard: mkCard, pill: pill, lead: lead, ict: ict, ua: ua, dotted: dotted,
    skeleton: skeleton, state: state, failed: failed, toast: toast, undoToast: undoToast, haptic: haptic, tap: tap,
    api: api, store: store, zl: zl, dm: dm, dmt: dmt, plain: plain, dealParts: dealParts, whenW: whenW, wd: wd, wp: wp, days: days,
    addDays: addDays, plural: plural, grouped: grouped, openLink: openLink, svg: svg, chart: chart,
    drawProduct: drawProduct, weekChart: weekChart, rateText: rateText, rateStrip: rateStrip, hrow: hrow, capped: capped,
    myGameRow: myGameRow, sleepLine: sleepLine, receiptsLine: receiptsLine, prodPic: prodPic, imgOk: imgOk, categoryOf: categoryOf,
    todayLabel: todayLabel, show: show, views: VIEWS, markItem: markItem, keepItems: keepItems, dropMark: dropMark,
    itemKey: itemKey, markPick: markPick, keepPicks: keepPicks, flushBatch: flushBatch, pickSeg: pickSeg,
    pickAll: pickAll, dealsAll: dealsAll, shopIs: shopIs, shopSegs: shopSegs, names: NAMES, get tabs() { return visibleTabs(); }, main: main, hdr: hdr, rail: rail,
    hTitle: hTitle, wide: wide, browser: browser, tg: tg, BASE: BASE, WEEK: WEEK, SRC: SRC, SRC_CLASS: SRC_CLASS,
    PERIODS: PERIODS, WISH_STATUS: WISH_STATUS, WISH_PILL: WISH_PILL, DELA_ICON: DELA_ICON, DELA_KIND: DELA_KIND,
    DELA_DONE: DELA_DONE, delaHint: delaHint, swr: swr, chip: chip, MONEY: MONEY, MONEY_CATS: MONEY_CATS, moneyCat: moneyCat,
    moneyFmt: moneyFmt, moneyNav: moneyNav, moneyGo: moneyGo, moneyLoad: moneyLoad, moneyVs: moneyVs, moneySheet: moneySheet, moneyDelete: moneyDelete,
    moneyCats: moneyCats, moneySubs: moneySubs, moneyTrends: moneyTrends, moneyTrendsDraw: moneyTrendsDraw, moneyAccts: moneyAccts, moneyShown: moneyShown, moneyFilterChips: moneyFilterChips,
    moneyState: moneyState, moneyStatePaint: moneyStatePaint, moneyRowInfo: moneyRowInfo, moneyIncomeLine: moneyIncomeLine, moneyMonthMenu: moneyMonthMenu, moneySearchBar: moneySearchBar, moneyOwn: moneyOwn,
    moneyTile: moneyTile, merchantIc: merchantIc, moneyAcctName: moneyAcctName, moneySubLine: moneySubLine, moneyRegularSheet: moneyRegularSheet, moneyListShown: moneyListShown, moneyFoundChip: moneyFoundChip,
    moneyCardsInto: moneyCardsInto, moneyCardOn: moneyCardOn, moneyCardOrder: moneyCardOrder, moneyPrefsHook: moneyPrefsHook, moneyEmpty: moneyEmpty, moneyDay: moneyDay, moneyDayWord: moneyDayWord, moneyShare: moneyShare, moneyTime: moneyTime, monthLabel: monthLabel, moneyHomeOn: moneyHomeOn, moneyHomeText: moneyHomeText,
    moneyDailyText: moneyDailyText, moneyDailySheet: moneyDailySheet, moneyDailyBox: moneyDailyBox,
    moneyReviewOn: moneyReviewOn, moneyReviewHomeText: moneyReviewHomeText, moneyReviewSheet: moneyReviewSheet, moneyYearSheet: moneyYearSheet, VB_FROM: VB_FROM, CAT_EMO: CAT_EMO, mechRu: mechRu, levelRu: levelRu, hallRu: hallRu,
    get current() { return current; }, get login() { return login; }
  };
  window.DESKTOP = window.DESKTOP || { views: {} };
  // Each name is a stylesheet and a script next to the page: desktop (the shared helpers and the overview),
  // desktop-a and desktop-b (the wide tabs). A missing file is a harmless 404.
  var DESKTOP_FILES = ['desktop', 'desktop-a', 'desktop-b'];
  function loadDesktop() {
    if (!wide() || loadDesktop.done) return;

    var meta = document.querySelector('meta[name="published"]'), v = '?v=' + encodeURIComponent((meta && meta.content) || '0');
    var left = DESKTOP_FILES.length;
