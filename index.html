<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0d14">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef0ff">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="published" content="2026-10-18 21:12">

<title>Помощник</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap">
<style>
/* Design: Valerii's pair of 17.10.2026 on the Geist structure (docs/specs/miniapp-geist.md): dark «21» and light
   «22», glass cards (blurred, translucent) on a violet gradient, Manrope, rows split by 1 px hairlines edge to
   edge, hover on everything interactive. The violet accent on primary buttons, the brand mark, the current tab,
   .pill.acc, stars, meters and chart bars. Telegram: data-theme from tg.colorScheme, its header the gradient's
   top; a browser follows prefers-color-scheme. Phone: header, bottom bar, «Ещё»
   sheet; from 900 px a rail (date, «выйти» at its foot), content to 1200 px, .main.narrow 720 px. */
:root{color-scheme:dark;
  --bg0:#0b0d14;--grad:linear-gradient(160deg,#0b0d14 0%,#1a1440 100%);--glass:rgba(11,13,20,.7);--solid:#1d1b33;
  --surface:rgba(255,255,255,.06);--surface-2:rgba(255,255,255,.07);--card-line:rgba(255,255,255,.1);--line:rgba(255,255,255,.1);
  --line-2:rgba(255,255,255,.18);--track:rgba(255,255,255,.12);--press:rgba(255,255,255,.06);
  --fg:#fff;--muted:#9aa0b4;--muted-2:#8c92a8;--accent:#7656ff;--accent-ink:#fff;--mark:#8b6cff;--link:#a891ff;
  --accent-soft:rgba(139,108,255,.16);--good:#3ecf8e;--good-bg:rgba(62,207,142,.12);--warn:#f5a623;
  --warn-bg:rgba(245,166,35,.12);--bad:#ff6166;--bad-bg:rgba(255,97,102,.12);--blue:#52a8ff;
  --toast:#1d1b33;--toast-act:var(--link);--toast-fg:#fff;--scrim:rgba(0,0,0,.6);--shadow:0 8px 24px rgba(0,0,0,.35);
  --r:20px;--r-b:14px;--r-s:10px;--bar:60px;--rail:240px;
  --font:"Manrope",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-num:var(--font)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light;
  --bg0:#eef0ff;--grad:linear-gradient(160deg,#eef0ff 0%,#fde7f3 100%);--glass:rgba(255,255,255,.6);--solid:#fff;
  --surface:rgba(255,255,255,.72);--surface-2:rgba(20,22,41,.04);--card-line:rgba(255,255,255,.9);--line:rgba(20,22,41,.08);
  --line-2:rgba(20,22,41,.16);--track:rgba(20,22,41,.08);--press:rgba(20,22,41,.05);--fg:#141629;
  --muted:#5b5f7a;--muted-2:#60647d;--accent:#6d4aff;--accent-ink:#fff;--mark:#6d4aff;--link:#5b36f2;--accent-soft:rgba(109,74,255,.12);
  --good:#0d7a4a;--good-bg:rgba(13,122,74,.1);--warn:#9a5a00;--warn-bg:rgba(200,128,0,.12);--bad:#c62828;
  --bad-bg:rgba(198,40,40,.1);--blue:#0070f3;--toast:#141629;--toast-act:#a891ff;--toast-fg:#fff;--scrim:rgba(0,0,0,.3);
  --shadow:0 8px 24px rgba(20,22,41,.1)}}
:root[data-theme="light"]{color-scheme:light;
  --bg0:#eef0ff;--grad:linear-gradient(160deg,#eef0ff 0%,#fde7f3 100%);--glass:rgba(255,255,255,.6);--solid:#fff;
  --surface:rgba(255,255,255,.72);--surface-2:rgba(20,22,41,.04);--card-line:rgba(255,255,255,.9);--line:rgba(20,22,41,.08);
  --line-2:rgba(20,22,41,.16);--track:rgba(20,22,41,.08);--press:rgba(20,22,41,.05);--fg:#141629;
  --muted:#5b5f7a;--muted-2:#60647d;--accent:#6d4aff;--accent-ink:#fff;--mark:#6d4aff;--link:#5b36f2;--accent-soft:rgba(109,74,255,.12);
  --good:#0d7a4a;--good-bg:rgba(13,122,74,.1);--warn:#9a5a00;--warn-bg:rgba(200,128,0,.12);--bad:#c62828;
  --bad-bg:rgba(198,40,40,.1);--blue:#0070f3;--toast:#141629;--toast-act:#a891ff;--toast-fg:#fff;--scrim:rgba(0,0,0,.3);
  --shadow:0 8px 24px rgba(20,22,41,.1)}
*{box-sizing:border-box}
html,body{margin:0;color:var(--fg)}
html{background:var(--bg0)}
/* The gradient on a fixed layer behind the page: iOS ignores background-attachment:fixed. */
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--grad);pointer-events:none}
body{font:14px/1.45 var(--font);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overflow-x:hidden}
button,input{font:inherit;color:inherit}
html{touch-action:pan-x pan-y}/* no pinch or double-tap zoom on the phone (Valerii, 18.10.2026) */
.field input{font-size:16px}/* under 16px iOS zooms in on focus */
button{cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* shell */
.col{min-width:0}
.hdr{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;min-height:52px;padding:env(safe-area-inset-top) 16px 0;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.hdr h1{flex:1;min-width:0;margin:0;font:800 20px/1.2 var(--font);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .date{color:var(--muted);font-size:13px;white-space:nowrap}
/* a refresh under way (docs/specs/app-cache-first.md): a 2px bar on the header's bottom edge, outside the flow */
.hdr.busy::after{content:"";position:absolute;left:0;bottom:-1px;width:30%;height:2px;background:var(--accent);animation:busy 1.1s ease-in-out infinite alternate}
@keyframes busy{to{transform:translateX(233.333%)}}
.out{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r-b);background:none;color:var(--muted);font-size:13px;transition:background .12s}
.out .i{width:16px;height:16px}
.main{padding:12px 16px calc(var(--bar) + 28px + env(safe-area-inset-bottom))}
.main.in{animation:fade .12s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(3px)}}
.rail{display:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;height:calc(var(--bar) + env(safe-area-inset-bottom));padding:0 4px env(safe-area-inset-bottom);background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tabbar button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;color:var(--muted);font:500 11px/1.1 var(--font)}
.tabbar .ic{display:grid;place-items:center;width:52px;height:30px;border-radius:15px;transition:background .12s}
.tabbar .lb{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabbar [aria-current]{color:var(--accent)}
.tabbar [aria-current] .ic{background:var(--accent-soft)}
.scrim{position:fixed;inset:0;z-index:6;background:var(--scrim);opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:7;padding:6px 12px calc(14px + env(safe-area-inset-bottom));background:var(--solid);border:1px solid var(--card-line);border-bottom:0;border-radius:var(--r) var(--r) 0 0;box-shadow:var(--shadow);transform:translateY(105%);visibility:hidden;transition:transform .24s cubic-bezier(.2,.8,.2,1),visibility 0s .24s}
.more .scrim{opacity:1;visibility:visible;transition:opacity .2s}
.more .sheet{transform:none;visibility:visible;transition:transform .24s cubic-bezier(.2,.8,.2,1)}
.grab{width:36px;height:4px;margin:4px auto 10px;border-radius:2px;background:var(--line)}
.sheet button,.rail>button{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;padding:0 12px;border:0;border-radius:var(--r-b);background:none;color:var(--fg);font:500 15px/1.2 var(--font);text-align:left;transition:background .12s}
.sheet .ic,.rail .ic{display:grid;place-items:center;width:32px;height:32px;border:1px solid var(--line);border-radius:var(--r-s);color:var(--muted)}
.sheet [aria-current],.rail [aria-current]{background:var(--accent-soft);color:var(--link)}
.sheet [aria-current] .ic,.rail [aria-current] .ic{border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent)}
.brand{display:flex;align-items:center;gap:10px;height:40px;margin:0 0 12px;padding:0 8px;font:800 14px/1 var(--font);letter-spacing:-.02em}
.mark{display:grid;place-items:center;width:24px;height:24px;border-radius:var(--r-s);background:var(--accent);color:var(--accent-ink)}
.mark .i{width:16px;height:16px}
.rfoot{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);color:var(--muted-2);font-size:12px}
@media (hover:hover){.rail button:not([aria-current]):hover,.sheet button:not([aria-current]):hover,.row.tap:hover,.row:has(button):hover,.btn.ghost:hover,.out:hover{background:var(--press)}.tabbar button:not([aria-current]):hover .ic{background:var(--press)}
  .btn:not(.ghost):not(.warn):hover{filter:brightness(.94)}.pg:hover,button.pill:hover,.chips .pill:hover{border-color:var(--line-2);color:var(--fg)}.seg button:hover,.rail>button:not([aria-current]):hover{color:var(--fg)}}
/* blocks */
.card{background:var(--surface);border:1px solid var(--card-line);border-radius:var(--r);margin:0 0 16px;overflow:hidden;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:var(--shadow)}
.ch{display:flex;align-items:center;gap:10px;min-height:44px;padding:10px 14px 6px}
.ch:last-child{padding-bottom:10px}
.card.hero{background-size:cover;background-position:center}
.ch .ico{display:grid;place-items:center;flex:none;width:28px;height:28px;border:1px solid var(--line);border-radius:var(--r-s);color:var(--muted)}
.ch .ico .i{width:16px;height:16px}
.ch h3{flex:1;min-width:0;margin:0;font:800 14px/1.3 var(--font);letter-spacing:-.02em}
.card .sub{padding:0 14px 10px;color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:9px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.tap{cursor:pointer;transition:background .12s}
.row.tap:focus-visible{outline-offset:-2px}
.row.tap:active{background:var(--press)}
.row>.i.go{width:16px;height:16px;color:var(--muted-2)}
.row .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.row .t{font-weight:500}
.row b{font-weight:600}
.row .pr{flex:none;text-align:right;font:500 14px/1.3 var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .mech{display:block;color:var(--warn);font:400 12px var(--font)}
.row .old{display:block;color:var(--muted-2);text-decoration:line-through;font:400 12px var(--font-num);font-variant-numeric:tabular-nums}
.row .mk{width:22px;height:22px;color:var(--muted)}
.row .mk.on{color:var(--mark)}
.row.done .t{color:var(--muted);text-decoration:line-through}
.row.soon{background:color-mix(in srgb,var(--bad) 8%,transparent)}
.row.small{min-height:40px}
.lead{display:grid;place-items:center;flex:none;width:22px;color:var(--muted)}
.lead .i{width:18px;height:18px}
.mu{color:var(--muted);font-size:13px}
.clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 7px;border:1px solid var(--line);border-radius:999px;background:none;color:var(--muted);font:500 12px/1 var(--font);white-space:nowrap;vertical-align:1px}
.pill.good{color:var(--good)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}
.pill.good,.pill.warn,.pill.bad{border-color:color-mix(in srgb,currentColor 45%,transparent);background:color-mix(in srgb,currentColor 8%,transparent)}
.pill.acc{border-color:transparent;background:var(--accent-soft);color:var(--link)}
.t .pill,.mu .pill{margin-left:6px}
.cmp span{white-space:nowrap}
.cmp .cw{font-weight:600;color:var(--link)}
.meter{height:6px;margin:6px 0 2px;border-radius:3px;background:var(--track);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:var(--mark)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:0 16px;border:0;border-radius:var(--r-b);background:var(--accent);color:var(--accent-ink);font:500 14px/1.1 var(--font);white-space:nowrap;transition:background .12s,filter .12s}
.btn .i{width:18px;height:18px}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5}
.btn.ghost{background:none;color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.btn.warn{background:var(--warn-bg);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.btn.wide{width:100%}
.btn.x{flex:none;padding:0 10px}
.foot{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.foot .btn{flex:1 1 auto;min-width:0;padding:0 12px}
@media (max-width:399px){.foot .btn .i{display:none}}
.bar{display:flex;gap:8px;margin:0 0 12px}
.field{flex:1;min-width:0;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r-b);background:var(--surface-2);transition:border-color .12s,box-shadow .12s}
.field:focus-within{outline:2px solid var(--fg);outline-offset:2px}
.field .i{width:18px;height:18px;color:var(--muted)}
.field input{flex:1;min-width:0;height:42px;padding:0;border:0;background:none;outline:none;-webkit-appearance:none;appearance:none}
.field input::placeholder{color:var(--muted-2)}
.seg{display:flex;gap:2px;margin:0 0 16px;padding:2px;border:1px solid var(--line);border-radius:var(--r-b)}
.seg button{flex:1;min-width:0;min-height:40px;padding:0 8px;border:0;border-radius:var(--r-s);background:none;color:var(--muted);font:500 13px/1 var(--font);white-space:nowrap;transition:color .12s}
.seg.fit{overflow-x:auto;scrollbar-width:none}
.seg.fit button{flex:1 0 auto}
.seg button.on{background:var(--surface-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.summary{display:flex;gap:18px;margin:2px 2px 16px;color:var(--muted);font-size:13px}
.summary b{color:var(--fg);font:500 14px var(--font-num);font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:1px;border-top:1px solid var(--line)}
.tile{padding:12px 14px;box-shadow:1px 0 0 var(--line),0 1px 0 var(--line)}
.tile .k{color:var(--muted-2);font-size:12px}
.tile .v{font:500 14px/1.4 var(--font-num);font-variant-numeric:tabular-nums}
.tile.hero{grid-column:1/-1}
.tile:nth-child(even):last-child{grid-column:1/-1}
.tile.hero .v{font-size:28px;font-weight:800;line-height:1.2;letter-spacing:-.02em}
.state{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 16px;color:var(--muted);font-size:13px;text-align:center}
.state>.i{width:24px;height:24px;color:var(--muted-2)}
.state p{max-width:32ch;margin:0}
.skel{padding:16px 14px 8px}
.skel i{display:block;height:12px;margin:0 0 12px;border-radius:6px;background:var(--line);animation:pulse 1.2s ease-in-out infinite}
.skel i:nth-child(1){width:42%;height:14px}.skel i:nth-child(2){width:88%}.skel i:nth-child(3){width:64%}
@keyframes pulse{50%{opacity:.45}}
.ptile{position:relative;flex:none;display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface-2);font:20px/1 "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;object-fit:cover}
.ptile.big{width:56px;height:56px;font-size:30px}
.ptile .bd{position:absolute;right:-6px;bottom:-6px;padding:2px;border-radius:6px;background:var(--solid);box-shadow:0 0 0 1px var(--line);font-size:12px}
.ptile.none{color:var(--muted)}
.ptile .i{width:18px;height:18px}
.tb{flex:none;display:grid;place-items:center;width:44px;height:44px;margin:-4px;padding:0;border:0;border-radius:10px;background:none;cursor:pointer}
.tb:has(.big){width:64px;height:64px}
.poster{flex:none;width:56px;height:84px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface-2);object-fit:cover}
.poster.ph{display:grid;place-items:center;color:var(--muted)}
.poster.ph .i{width:22px;height:22px}
.poster-btn{flex:none;padding:0;border:0;background:none;line-height:0}
.zoom{position:fixed;inset:0;z-index:9;display:grid;place-content:center;justify-items:center;gap:12px;background:rgba(0,0,0,.95);color:var(--toast-fg);animation:fade .12s}
.zoom img{max-width:92vw;max-height:86vh;object-fit:contain;border-radius:var(--r)}
.zoom .x{position:absolute;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));border-radius:50%;color:inherit;background:rgba(0,0,0,.4)}
.zoom div{max-width:92vw;text-align:center;overflow-wrap:anywhere}
body.zoomed{overflow:hidden}
.row.film{align-items:flex-start}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
button.pill{cursor:pointer;transition:border-color .12s,color .12s}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.chips.dchain{padding:0 0 12px}
.chips .pill,.chips select{height:44px;padding:0 12px;font-size:13px}
.chips select{font-size:16px}
.chips select{border:1px solid var(--line);border-radius:999px;background:var(--surface-2);color:var(--fg);font-family:var(--font)}
.row.off{opacity:.55}
.pg{flex:none;display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 8px;border:1px solid var(--line);border-radius:999px;background:none;color:var(--muted);font-size:12px;transition:border-color .12s,color .12s}
.pg .i{width:14px;height:14px}
.row.film .pg{min-height:44px}
.row.dela{flex-wrap:wrap;align-items:flex-start}.row.dela .pg{min-height:44px}.row.dela .pr{margin-top:8px}
.row.dela>.acts{flex-basis:100%;margin:-4px 0 0 48px}
.row.ib .t{overflow-wrap:anywhere}.card.tap{cursor:pointer}
.pg.warn{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.lnk{color:var(--link);font-weight:500;text-decoration:none}
.card ul{margin:0;padding:2px 14px 14px 32px}
.card li{margin:5px 0}
.card li::marker{color:var(--muted-2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:0 14px 10px;color:var(--muted);font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%}
/* A row that unfolds on a tap (Genshin builds, the next plan, an event's tip): the chevron turns, the block under it is tinted. */
.row>.i.go{transition:transform .15s}.row.open>.i.go{transform:rotate(180deg)}
.det{background:var(--surface-2)}.det>.row:first-child{border-top:1px solid var(--line)}
.tip{padding:9px 14px 12px;border-top:1px solid var(--line);font-size:13px;white-space:pre-line;overflow-wrap:anywhere}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.02em}
.dash{width:14px;border-top:2px dashed var(--mark)}
.chart{display:block;width:100%;height:auto;padding:4px 8px 0}
.chart .ax{stroke:var(--line)}
.chart .grid{stroke:var(--line);stroke-dasharray:2 4}
.chart .tk{fill:var(--muted-2);font:11px var(--font-num);font-variant-numeric:tabular-nums}
.chart .tk.strong{fill:var(--fg);font-weight:600;paint-order:stroke;stroke:var(--solid);stroke-width:4px;stroke-linejoin:round}
.chart .ln{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-linejoin:round}
.chart .minl{stroke:var(--mark);stroke-dasharray:4 3;opacity:.8}
.chart .last{stroke:var(--solid);stroke-width:2}
.chart .b{fill:var(--mark)}
.chart .b.now{fill-opacity:.3;stroke:var(--mark)}
.chart .nm{fill:var(--fg);font:12px var(--font)}.chart .hit{fill:transparent}.chart g:hover>.b{fill-opacity:.75}.chart g:focus{outline:none}.chart g:focus-visible>.b{stroke:var(--fg);stroke-width:1.5}
.fst{padding:14px 14px 0;color:var(--muted);font-size:12px;font-weight:600}
.s-lf{fill:var(--mark);background:var(--mark)}.s-al{fill:var(--blue);background:var(--blue)}.s-rc{fill:var(--fg);background:var(--fg)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(var(--bar) + 12px + env(safe-area-inset-bottom));z-index:9;max-width:420px;margin:0 auto;padding:12px 16px;border:1px solid var(--line-2);border-radius:var(--r-b);background:var(--toast);color:var(--toast-fg);box-shadow:var(--shadow);font-size:13px;text-align:center;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none}
#toast.on{opacity:1;transform:none}
#toast.act{pointer-events:auto}
#toast .tl{min-height:44px;margin:-12px 0;padding:0 6px;border:0;background:none;color:var(--toast-act);font-weight:600}
.row .qty{margin-left:6px;font-weight:400}
.login{max-width:400px;margin:14vh auto 0;padding:28px 20px 12px;text-align:center}
.login .mark{width:40px;height:40px;margin:0 auto 14px;border-radius:12px}
.login .mark .i{width:22px;height:22px}
.login h1{margin:0 0 6px;font:800 20px/1.2 var(--font);letter-spacing:-.02em}
.login p{margin:0 0 4px;color:var(--muted);font-size:13px}
.login .widget{min-height:56px;padding:14px 0 8px}
.wrap{margin:0 16px}
@media (min-width:900px){
  .shell{padding-left:var(--rail)}
  .rail{display:flex;flex-direction:column;gap:2px;position:fixed;top:0;bottom:0;left:0;width:var(--rail);padding:12px 12px 16px;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-right:1px solid var(--line);overflow-y:auto}
  .rail>button{gap:10px;min-height:32px;padding:0 8px;color:var(--muted);font-size:13px}
  .rail .ic,.rail .ic .i{width:16px;height:16px;border:0}
  .tabbar,.sheet,.scrim,.hdr .date,.hdr .out{display:none}
  .hdr{min-height:56px;padding:0 32px}
  .main{max-width:1264px;padding:24px 32px 48px}
  .main.narrow{max-width:784px}
  .row{min-height:40px;padding:8px 14px}
  .btn{min-height:36px;min-width:36px}
  .pg,.row.film .pg,.row.dela .pg{min-height:32px}
  .field{min-height:36px}

  .seg.fit button{flex:1 0 auto}
  .chips .pill,.chips select{height:32px}
  /* Cards flow down columns (up to three of 380 px) instead of a row grid: a short card no longer leaves a hole under
     itself when its neighbour is tall (the Genshin tab's header beside «Сегодня», 18.10.2026). */
  .cols{columns:3 380px;column-gap:16px;margin-bottom:16px}

/* After the Geist review (11.10): the active segment reads in dark, content centred on wide screens, a grey search
   clear in light, the focus ring inside a scrolling segment, 44 px segments on the phone, the current tab bolder. */

/* «Фильмы» (docs/specs/films.md): a 44×66 poster in rows, a 3-column poster grid whose tapped tile unfolds a
   full-width block under its line, rating and genre chips that scroll edge to edge, a clear button in the field. */
.fp{flex:none;width:44px;height:66px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface-2);object-fit:cover}
.fp.big{display:block;width:100%;height:auto;aspect-ratio:2/3}

/* v2 (docs/specs/films-v2.md): the type switch inside «Подборка», the status chips under the rating strip, the small

.card>.seg{margin:0 14px}.hs+.hs,.fi>.row+.hs{padding-top:0}.fk{font-size:12px}.ch.tap{cursor:pointer}.hs.fty{padding:0 0 12px}

.tiles.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.tiles.g3 .tile{grid-column:auto;padding:8px 14px}.tiles.g3 .v{font-size:15px;font-weight:700}.tiles.g3 .k{font-size:11px}

<script>
(function () {
  var app = document.getElementById('app');

  // телефона» opens the page with ?key=…, kept in localStorage and taken out of the address bar.

  // Inside Telegram the theme follows the app: data-theme from colorScheme, and
  // the gradient's top colour (--bg0) under Telegram's header. A browser follows the system.
  function theme() {
    root.setAttribute('data-theme', tg.colorScheme === 'light' ? 'light' : 'dark');
    var bg = getComputedStyle(root).getPropertyValue('--bg0').trim();
    try { tg.setHeaderColor(bg); } catch (e) {}
    try { tg.setBackgroundColor(bg); } catch (e) {}
  }

    var query = new URLSearchParams(location.search);
    appKey = query.get('key') || store('appKey') || null;
    if (query.get('key')) {
      store('appKey', appKey);
      // Safari keeps ?key= so «На экран Домой» saves a URL that carries it: the installed app has its own storage and reads it on first launch.
      if (navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)) {
        query.delete('key');
        try { history.replaceState(null, '', location.pathname + (query.toString() ? '?' + query : '') + location.hash); } catch (e) {}
      }
    }
    try { login = JSON.parse(store('tgLogin') || 'null'); } catch (e) {}
    if (!login || !(Date.now() / 1000 - Number(login.auth_date) < 7 * 86400)) login = null;
  } else {
    try { tg.ready(); } catch (e) {}
    try { tg.expand(); } catch (e) {}
    theme();
    try { tg.onEvent('themeChanged', theme); } catch (e) {}
  }

  var BASE = 'https://ssfkoyyhxqcmjokdxkpn.supabase.co/functions/v1/';

    closed: 'Уже закрыто', 'nothing selected': 'Ничего не отмечено', 'no such item': 'Уже убрано',

    'no such film': 'Нет такого фильма', 'no such event': 'Нет такого события', 'no such row': 'Уже закрыто', 'bad date': 'Дата — сегодня или позже',

    text(toastEl, s || 'Не получилось, попробуй ещё раз');

  }

  function undoToast(s, ids, after) {
    backToast(s, function () { api('telegram-webhook', { action: 'undo', ids: ids.join(',') }).then(after, noop); });
  }

  // The x-tg-login header: the login object's JSON as base64url (UTF-8).

  // A deal line («Żel do prania Coccolino, 1,48 l · <b>−50%</b> · 1+1 🪪») as a person reads it: the full name

  var DEAL_RU = [[/^drugi −(\d+)%$/i, 'второй −$1%'], [/^drugi za (.+)$/i, 'второй за $1'], [/^co druga −(\d+)%$/i, 'каждая вторая −$1%'],
    [/^przy (\d+) szt\.$/i, 'при покупке $1 шт.'], [/^1\+1$/, 'второй в подарок'], [/^2\+1$/, 'третий в подарок'],

    s = s.replace(/^⭐ /, '');
    warn = /^⚠️ не скидка · /.test(s);
    s = s.replace(/^⚠️ не скидка · /, '');
    var segs = s.split(' · '), name = segs.shift() || String(c.label || '').replace(/^⭐ /, '').replace(/^[−-]\d+% /, '');
    var note = [];
    segs.forEach(function (x) {
      var card = / 🪪$/.test(x);
      x = x.replace(/ 🪪$/, '').replace(/ 🪪/g, ' по карте').trim();
      if (/^\d[\d,]*( \d[\d,]*)?$/.test(x)) x = '';  // the price and the old price: the right column has them
      DEAL_RU.forEach(function (r) { x = x.replace(r[0], r[1]); });
      if (x) note.push(x);
      if (card) note.push('по карте');

  function categoryOf(name) {

  }

  // Weekly spend as bars: the current week outlined, every few weeks dated,

      var a = { x: x, y: H - B - h, width: step * 0.7, height: h, rx: 2, 'class': w.week_start === now ? 'b now' : 'b' };

  // The films statistics' three charts (docs/specs/films-stats.md, the dataviz skill's marks): one series in --mark,

  // every bar a focusable group with a <title> and an aria-label over a transparent hit band.
  function films(n) { return n + ' ' + plural(n, ['фильм', 'фильма', 'фильмов']); }

        + 'A' + r + ',' + r + ' 0 0 1 ' + f(x + w - r) + ',' + f(y + h) + 'H' + f(x) + 'Z'
      : 'M' + f(x) + ',' + f(y + h) + 'V' + f(y + r) + 'A' + r + ',' + r + ' 0 0 1 ' + f(x + r) + ',' + f(y) + 'H' + f(x + w - r)
        + 'A' + r + ',' + r + ' 0 0 1 ' + f(x + w) + ',' + f(y + r) + 'V' + f(y + h) + 'Z';
  }
  // A bar: hit band {x, y, w, h} and the drawn bar inside it; a zero-length bar keeps only its hit band.

  // Genres by n: the name on the left, in line with the card's text (a column as wide as the longest name, measured), the bar, «62 · ★ 4,6» at its tip.
  function genresChart(rows, W) {

  function decadesChart(rows, W) {

    var H = 176, L = 4, T = 20, B = 38, n = rows.length || 1, step = (W - 2 * L) / n, bw = Math.min(24, step - 4);

  // --- wishlist ---

      var p = normPrefs(j.prefs);
      cacheSet('prefs', JSON.stringify({ prefs: p }));
      return JSON.stringify(p);
    });
  }
  // Cache-first: the cached copy is already in memory; a fresh one that differs redraws the shell.
  function loadPrefs() {
    swr({ key: 'prefs', box: shell, n: 0, live: function () { return true; },
      // A stale answer (an edit or a save came after the request left) and an offline start both give back the settings
      // on screen, so the cached copy is not overwritten and no second «Не обновилось» toast comes.
      fetch: function () {
        var gen = prefsGen;
        return api('miniapp', { action: 'prefs_get' }, 15000, true).then(function (j) {
          return gen === prefsGen ? j : { prefs: prefs };
        }, function (e) { if (e.login) throw e; return { prefs: prefs }; });
      },
      render: function (j) { if (j && j.prefs && !marks.prefs) setPrefs(normPrefs(j.prefs)); } });
  }
  // A small button of a settings row: a toggle (f 'tog', aria.on) or an arrow (f 'up' / 'down').
  function rowBtn(ic, aria, f, off, fn) {
    var b = add(el('button', 'btn ghost x'), icon(ic, f === 'tog' ? 'mk' + (aria.on ? ' on' : '') : ''));
    b.type = 'button';
    b.setAttribute('aria-label', aria.label);
    if (f === 'tog') b.setAttribute('aria-pressed', String(aria.on));
    b.disabled = off;
    b.onclick = fn;
    b.f = f;
    return b;
  }
  // The rows are new nodes after a change: the keyboard goes back to the button it pressed, or to the row's toggle.
  function refocus(rows, focus, kind) {
    if (!focus || focus[0] !== kind) return;
    if (focus[1] === 'reset') {
      var first = rows.querySelector('button:not(:disabled)');
      if (first) first.focus();
      return;
    }
    var r = [].filter.call(rows.children, function (x) { return x.k === focus[1]; })[0];
    if (!r) return;
    var b = [].filter.call(r.querySelectorAll('button'), function (x) { return x.f === focus[2] && !x.disabled; })[0];
    (b || r.querySelector('button')).focus();
  }
  // «Вкладки»: every tab with a toggle; «Сегодня» and «Что нового» always stay.
  function tabsCard() {
    var card = mkCard('more', 'Вкладки'), rows = el('div');
    card.appendChild(rows);
    card.paint = function (focus) {
      var hid = prefs.tabs.hidden;
      clear(rows);
      TABS.forEach(function (t) {
        var k = t[0], row = add(lead(el('div', 'row'), t[1]), el('span', 'tx t', t[2]));
        if (TAB_KEYS.indexOf(k) < 0) row.appendChild(el('span', 'pr mu', 'всегда'));
        else {
          var on = hid.indexOf(k) < 0;
          row.appendChild(rowBtn(on ? 'check-square' : 'square', { label: t[2] + ': показывать', on: on }, 'tog', false, function () {
            editPrefs({ tabs: { hidden: on ? hid.concat([k]) : hid.filter(function (x) { return x !== k; }) }, home: prefs.home },
              ['tab', k, 'tog']);
          }));
        }
        row.k = k;
        rows.appendChild(row);
      });
      refocus(rows, focus, 'tab');
    };
    card.paint();
    return card;
  }
  // «Карточки на «Сегодня»»: a toggle, the name and ▲ ▼ per card, in the order «Сегодня» draws them; «Сбросить»
  // brings back every card in the default order. The morning brief's own «недоступно» stub has no row and keeps
  // its place after «План недели».
  function homeCard() {
    var card = mkCard('house', 'Карточки на «Сегодня»'), rows = el('div'), foot = el('div', 'foot');
    var reset = el('button', 'btn ghost', 'Сбросить');
    reset.type = 'button';
    reset.onclick = function () { editPrefs({ tabs: prefs.tabs, home: { hidden: [], order: [] } }, ['home', 'reset']); };
    foot.appendChild(reset);
    card.appendChild(rows);
    card.paint = function (focus) {
      var hid = prefs.home.hidden, keys = homeOrder().filter(function (k) { return k !== 'morning'; });
      clear(rows);
      keys.forEach(function (k, i) {
        var on = hid.indexOf(k) < 0, name = HOME_NAMES[k], row = el('div', 'row');
        function move(d) {
          var o = keys.slice();
          o.splice(i, 1);
          o.splice(i + d, 0, k);
          o.splice(o.indexOf('plan') + 1, 0, 'morning');
          editPrefs({ tabs: prefs.tabs, home: { hidden: hid, order: o } }, ['home', k, d < 0 ? 'up' : 'down']);
        }
        add(row, rowBtn(on ? 'check-square' : 'square', { label: name + ' на «Сегодня»', on: on }, 'tog', false, function () {
          editPrefs({ tabs: prefs.tabs, home: { hidden: on ? hid.concat([k]) : hid.filter(function (x) { return x !== k; }),
            order: prefs.home.order } }, ['home', k, 'tog']);
        }), el('span', 'tx t', name),
          rowBtn('chevron-up', { label: name + ': выше' }, 'up', i === 0, function () { move(-1); }),
          rowBtn('chevron-down', { label: name + ': ниже' }, 'down', i === keys.length - 1, function () { move(1); }));
        row.k = k;
        rows.appendChild(row);
      });
      if (hid.length || prefs.home.order.length) card.appendChild(foot);
      else if (foot.parentNode) card.removeChild(foot);
      refocus(rows, focus, 'home');
    };
    card.paint();
    return card;
  }

  // --- bottom bar ---
  // «Кнопки внизу»: the four tabs of the phone's bottom bar and their order, kept on this device (store tabBar,
  // a JSON array of tab keys); the others go to «Ещё», the wide rail shows all. Chosen rows come first, in order.
  function barCard() {
    var card = mkCard('panel-bottom', 'Кнопки внизу'), line = el('div', 'sub'), rows = el('div'), foot = el('div', 'foot');
    var reset = el('button', 'btn ghost', 'Сбросить');
    reset.type = 'button';
    reset.onclick = function () {
      haptic();
      store('tabBar', '');
      drawBar();
      paint('reset');
    };
    foot.appendChild(reset);
    add(card, line, rows);
    function save(keys, focus) {
      haptic();
      store('tabBar', JSON.stringify(keys));
      drawBar();
      paint(focus);
    }
    function paint(focus) {
      var bar = barTabs(), full = bar.length >= 4;
      text(line, full ? 'Максимум 4 — сними одну, чтобы поставить другую' : 'В панели ' + bar.length + ' из 4, остальные в «Ещё»');
      clear(rows);
      bar.concat(MORE).forEach(function (k) {
        var t = tabOf(k), i = bar.indexOf(k), on = i >= 0, row = lead(el('div', 'row'), t[1]);
        add(row, el('span', 'tx t', t[2]));
        function move(d) {
          var keys = bar.slice();
          keys.splice(i, 1);
          keys.splice(i + d, 0, k);
          save(keys, [k, d < 0 ? 'up' : 'down']);
        }
        if (on) {
          add(row, rowBtn('chevron-up', { label: t[2] + ': выше' }, 'up', i === 0, function () { move(-1); }),
            rowBtn('chevron-down', { label: t[2] + ': ниже' }, 'down', i === bar.length - 1, function () { move(1); }));
        }
        row.appendChild(rowBtn(on ? 'check-square' : 'square', { label: t[2] + ' в панели', on: on }, 'tog', !on && full, function () {
          save(on ? bar.filter(function (x) { return x !== k; }) : bar.concat([k]), [k, 'tog']);
        }));
        row.k = k;
        rows.appendChild(row);
      });
      if (store('tabBar')) card.appendChild(foot);
      else if (foot.parentNode) card.removeChild(foot);
      // The rows are new nodes: the keyboard stays on the button it pressed, or on its row's toggle.
      if (focus === 'reset') return rows.querySelector('button:not(:disabled)').focus();
      var r = focus && [].filter.call(rows.children, function (x) { return x.k === focus[0]; })[0];
      if (r) {
        var b = [].filter.call(r.querySelectorAll('button'), function (x) { return x.f === focus[1] && !x.disabled; })[0];
        (b || r.lastChild).focus();
      }
    }
    card.paint = paint;
    paint();
    return card;
  }

  // --- changelog ---
  // changelog.json is published next to the page; the publish script stamps
  // the page's own date into <meta name="published">.
  function newsView() {
    var body = add(el('div'), skeleton(2)), meta = document.querySelector('meta[name="published"]');
    var tc = tabsCard(), hc = homeCard(), bc = barCard();
    prefsHook = { tab: 'news', fn: function (focus) { tc.paint(focus); hc.paint(focus); bc.paint(); } };
    add(main, browser ? pushCard() : null, tc, hc, bc, body, el('p', 'mu', 'страница: ' + ((meta && meta.content) || 'не опубликована')));
    fetch('./changelog.json', { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    }).then(function (list) {
      if (current !== 'news') return;
      clear(body);
      list.forEach(function (e) {
        var ul = el('ul');
        e.lines.forEach(function (l) { ul.appendChild(el('li', '', l)); });
        body.appendChild(add(mkCard('sparkles', dm(e.date) + '.' + e.date.slice(0, 4) + ' · ' + e.title), ul));
      });
    }).catch(function () {
      if (current === 'news') {
        add(clear(body), state('alert', 'Список обновлений недоступен', 'Повторить', function () { show('news'); }));
      }
    });
  }

  function isView(t) { return Object.prototype.hasOwnProperty.call(VIEWS, t); }
  var VIEWS = {
    home: homeView, list: listView, picks: picksView, prices: pricesView, stats: statsView, wish: wishView,
    cinema: cinemaView, films: filmsView, dela: delaView, inbox: inboxView, feed: feedView, news: newsView, vb: vbView,
    genshin: genshinView
  };
  // --- desktop (≥ 900 px) ---
  // app/desktop.css and app/desktop*.js are loaded only on a wide screen; they draw the tabs for a big
  // screen (DESKTOP.views[tab]) with the helpers below (docs/specs/miniapp-desktop.md). The phone never
  // loads them. The last script to arrive after the first paint redraws the current tab.
  var wideQuery = window.matchMedia ? matchMedia('(min-width:900px)') : null;
  function wide() { return !!(wideQuery && wideQuery.matches); }
  window.APP = {
    el: el, add: add, text: text, clear: clear, icon: icon, label: label, mkCard: mkCard, pill: pill, lead: lead,
    skeleton: skeleton, state: state, failed: failed, toast: toast, undoToast: undoToast, haptic: haptic, tap: tap,
    api: api, store: store, zl: zl, dm: dm, dmt: dmt, plain: plain, dealParts: dealParts, whenW: whenW, wd: wd, wp: wp, days: days,
    addDays: addDays, plural: plural, grouped: grouped, openLink: openLink, svg: svg, chart: chart,
    drawProduct: drawProduct, weekChart: weekChart, rateText: rateText, hrow: hrow, capped: capped,
    myGameRow: myGameRow, sleepLine: sleepLine, receiptsLine: receiptsLine, prodPic: prodPic, categoryOf: categoryOf,
    todayLabel: todayLabel, show: show, views: VIEWS, markItem: markItem, keepItems: keepItems, dropMark: dropMark,
    itemKey: itemKey, markPick: markPick, keepPicks: keepPicks, flushBatch: flushBatch, pickSeg: pickSeg,
    pickAll: pickAll, dealsAll: dealsAll, names: NAMES, get tabs() { return visibleTabs(); }, main: main, hdr: hdr, rail: rail,
    hTitle: hTitle, wide: wide, browser: browser, tg: tg, BASE: BASE, WEEK: WEEK, SRC: SRC, SRC_CLASS: SRC_CLASS,
    PERIODS: PERIODS, WISH_STATUS: WISH_STATUS, WISH_PILL: WISH_PILL, DELA_ICON: DELA_ICON, DELA_KIND: DELA_KIND,
    DELA_DONE: DELA_DONE, VB_FROM: VB_FROM, CAT_EMO: CAT_EMO, mechRu: mechRu, levelRu: levelRu, hallRu: hallRu,
    get current() { return current; }, get login() { return login; }
  };
  window.DESKTOP = window.DESKTOP || { views: {} };
  // Each name is a stylesheet and a script next to the page: desktop (the shared helpers and the overview),
  // desktop-a and desktop-b (the wide tabs). A missing file is a harmless 404.
  var DESKTOP_FILES = ['desktop', 'desktop-a', 'desktop-b'];
  function loadDesktop() {
    if (!wide() || loadDesktop.done) return;
    loadDesktop.done = true;
    var meta = document.querySelector('meta[name="published"]'), v = '?v=' + encodeURIComponent((meta && meta.content) || '0');
    var left = DESKTOP_FILES.length;
    DESKTOP_FILES.forEach(function (f) {
      var css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = f + '.css' + v;
      document.head.appendChild(css);
      var sc = document.createElement('script');
      sc.src = f + '.js' + v;
      sc.onload = sc.onerror = function () { if (!--left && current && DESKTOP.views[current] && shell.parentNode) show(current); };
      document.body.appendChild(sc);
    });
  }
  loadDesktop();
  if (wideQuery && wideQuery.addEventListener) {
    wideQuery.addEventListener('change', function () { loadDesktop(); if (current && shell.parentNode) show(current); });
  }
  if (browser && !login && !appKey) loginCard();
  else start();
  // The Home Screen app's service worker shows the pushes; Telegram's webview has no use for it.
  if (browser && 'serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(noop);
})();
</script>
